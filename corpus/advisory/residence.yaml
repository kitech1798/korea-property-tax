    상생임대주택 특례 축소는 개편안 기준으로 국회 미통과다. 또한 이 엔진은 2025-10-16 이전의 규제지역 이력을 수집하지 않아 취득
    당시의 조정대상지역 지정 여부를 판정하지 못한다.
