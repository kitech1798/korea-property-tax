entries:
- id: adv.residence.nonresident_one_house_reform
  title_ko: 비거주 1주택 — 개편안은 기본공제와 세액공제 두 갈래로 동시에 조인다
  severity: caution
  when:
    track: reform
    is_one_house: true
    resides: false
    year_min: 2027
    price_total_min: 900000000
  basis:
  - 종합부동산세법 §8①1 (현행)
  - 종합부동산세법 §9⑤⑥⑧ (현행)
  - 종합부동산세법 §7① (개정안 신설)
  - 종합부동산세법 §8① (개정안)
  - 종합부동산세법 §9⑤⑧⑨ (개정안)
  - 주택임대차보호법 §6①
  - 주택임대차보호법 §6의3①8·⑤·⑥
  - 2026년 세제개편안 상세본 p.60·p.61·p.64
  - 2026년 세제개편안 문답자료 p.39·p.43
  - 2026년 세제개편안 개조식 p.18·p.19
  fact_ko: |-
    현행법은 1세대1주택자면 거주 여부와 무관하게 기본공제 12억원을 일률 적용하고(종합부동산세법 §8①1), 세액공제는
    연령별(60세~20%·65세~30%·70세~40%, §9⑥)과 보유기간별(5년~20%·10년~40%·15년~50%, §9⑧)을 합해 80%
    한도로 준다(§9⑤). 개편안은 두 곳을 동시에 바꾼다. ① 기본공제를 거주 14억원 / 비거주 9억원으로 나누고(§8① 개정안),
    1세대1주택자는 공시가격 합계 14억원을 초과할 때만 종부세를 부과하는 과세대상 규정을 신설한다(§7① 개정안 신설). ② 보유공제를
    거주공제로 전환해 2027년은 보유공제를 절반(5년 10%·10년 20%·15년 25%)으로 낮춘 뒤 거주공제(5년 20%·10년
    40%·15년 50%)와 견주어 높은 쪽을 적용하고, 2028년부터는 거주공제만 남긴다. 연령별 공제와 80% 한도는 유지되나 지금은 없는
    세액공제 금액한도가 신설돼 2027년 800만원, 2028년 이후 600만원으로 묶인다(§9⑤·⑧·⑨ 개정안). 둘 다 2027.1.1.
    이후 납세의무 성립분부터 적용된다.
  advice_ko: |-
    종부세는 과세기준일(6월 1일) 현재의 상태로 그 해 세액이 확정되므로, 2027년분부터 14억원 공제를 받으려면 늦어도 2027년 5월
    31일까지 전입과 실제 거주를 마쳐야 한다 — 6월 2일에 이사하면 그해는 비거주로 확정되고 다음 해를 기다려야 한다. 세를 놓고 있다면
    역산 순서는 이렇다. ① 임대차 만료일을 확인하고, ② 만료일이 2027년 6월 1일 이후라면 갱신거절 통지 기한(만료 6개월 전부터 2개월
    전까지, 주택임대차보호법 §6①)을 역산해 2026년 하반기 안에 통지 여부를 결정하고, ③ 보증금 반환 자금 계획을 같은 시점에 맞춘다.
    세액공제 쪽 시계는 더 길다 — 거주공제의 첫 문턱이 거주 5년이므로 2027년 6월 1일 전에 거주를 시작해야 2032년분부터 20%,
    2037년분부터 40%가 붙는다. 전환이 1년 늦어지면 공제 시작도 통째로 1년 밀린다. 만 60세 이상이라면 거주와 무관한 연령별
    공제만으로 남는 세액이 얼마인지 먼저 확인하고, 그 위에 5년 뒤부터 얹히는 거주공제의 추가 절감액이 이사·임대 종료 비용을 넘는지
    비교하라.
  caveats_ko:
  - 개편안은 국회 미통과다. 통과·수정 여부에 따라 14억원/9억원 구분과 공제 전환 일정 자체가 달라질 수 있다.
  - |-
    전입신고만으로는 부족하다. 개편안은 거주기간을 주민등록표 전입일부터 전출일까지로 보되 공부상 기록과 실제 거주가 다르면 실제 거주로
    판단한다고 명시한다(상세본 p.84). 주소만 옮겨 두면 부인될 수 있다.
  - |-
    세액공제 금액한도가 새로 생긴다(2027년 800만원, 2028년 이후 600만원). 공시가격이 높을수록 공제율을 다 채워도 실제 공제는
    한도에서 잘리므로, 고가주택일수록 거주 전환의 세액공제 효과가 기대보다 작다.
  - |-
    임차인이 계약갱신요구권을 행사한 경우 임대인 실거주를 이유로 거절할 수 있으나(주택임대차보호법 §6의3①8), 거절 후 정당한 사유 없이
    2년 안에 제3자에게 임대하면 임차인에게 손해배상 책임을 진다(같은 조 ⑤·⑥).
  - |-
    세액공제는 1세대1주택자에게만 적용된다. 거주 전환 과정에서 새 집을 먼저 사서 2주택이 되면 그 해 공제가 통째로 사라진다(일시적 2주택
    등 특례에 해당하는 경우는 제외).
  - |-
    취학·근무상 형편 등 부득이한 사유로 비거주한 기간은 최장 3년까지 거주기간으로 인정될 수 있다(§9⑩ 신설). 해당된다면 이사하지 않고도
    공제가 유지될 여지가 있으므로 이사를 결정하기 전에 그 요건부터 확인하라.
  - 종부세만 보고 옮기면 안 된다. 거주지를 바꾸면 양도소득세의 거주기간 계산, 세대 구성, 취득세 판정이 함께 움직인다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    국회 미통과다. 더해서 '거주'의 판정 시점(과세기준일 현재인지, 연중 일정 기간 이상인지)과 입증 방법은 개편안 원문에 없고 시행령에
    위임돼 있어, 과세기준일 직전 전입이 인정되는지는 확정되지 않았다. 2027년 과도기의 비교 방식도 문서마다 표현이 달라(개조식 p.19
    '높은 공제율' / 문답자료 p.43 '큰 금액') 연령공제와 합산되는 순서에 따라 결과가 갈릴 수 있는 구간이 있다.
- id: adv.residence.multi_house_residence_share
  title_ko: 다주택 기본공제는 '어느 집에 사느냐'로 정해진다 — 4억원 + 5억원 × 거주주택 비중
  severity: opportunity
  when:
    track: reform
    is_one_house: false
    year_min: 2027
    price_total_min: 900000000
  basis:
  - 종합부동산세법 §8①3 (현행)
  - 종합부동산세법 §8① (개정안)
  - 종합부동산세법 §7① (개정안 신설)
  - 2026년 세제개편안 상세본 p.61
  - 2026년 세제개편안 문답자료 p.39·p.40·p.47
  - 2026년 세제개편안 개조식 p.18
  fact_ko: |-
    현행법은 1세대1주택자가 아닌 개인에게 주택 수·거주 여부와 무관하게 기본공제 9억원을 정액으로 준다(종합부동산세법 §8①3). 개편안은
    이를 '4억원 + (5억원 × 거주주택 공시가격 ÷ 주택 공시가격 합계액)'으로 바꾼다(§8① 개정안, 2027.1.1. 이후 납세의무
    성립분). 소유한 주택 어디에도 살지 않으면 공제는 4억원까지 내려가고, 보유 주택 중 비싼 집에 살수록 9억원에 가까워진다. 정부는
    공시가격 10억원 주택 2채 중 1채 거주 시 6.5억원, 10억원 주택 3채 중 1채 거주 시 약 5.7억원을 예시로 제시했다(문답자료
    p.40·p.47).
  advice_ko: |-
    여러 채를 가졌고 그중 한 곳에 산다면, 2027년 6월 1일 이전에 '더 비싼 집으로 거주지를 옮기는 것'만으로 기본공제의 분자가 커진다
    — 파는 것도 증여하는 것도 아니고 사는 집을 바꾸는 것뿐이다. 지금 할 일은 셋이다. ① 보유 주택의 최신 공시가격을 나란히 놓고 어느
    집이 분자로 잡히는지 확인한다. ② 세대원이 흩어져 살고 있다면 전입 구성을 정리해 어느 주택이 '거주주택'이 되는지 확정한다. ③ 어디에도
    살지 않는 상태(공제 4억원)라면 한 채에 들어가 사는 것만으로 공제가 오르므로, 그 절감액과 이사 비용을 비교한다.
  caveats_ko:
  - 국회 미통과다.
  - |-
    이 산식은 개편안 한 줄이 전부이고 세부 산정방법은 시행령에 위임돼 있다. 거주주택이 2채 이상인 세대의 처리, 분모가 인별 합산인지 세대
    합산인지, 지분 반영 전 금액인지 후 금액인지가 정해지지 않았다. 해석에 따라 공제액이 4억원에서 9억원 사이를 오간다.
  - |-
    기본공제가 커져도 총액이 준다고 단정할 수 없다. 개편안은 같은 시기에 공정시장가액비율을 60%에서 70%(2027년), 3주택 이상
    보유자·조정대상지역 주택 보유자는 80%(2028년)로 올리고 세부담 상한도 150%에서 200%로 완화한다.
  - |-
    거주지를 옮기면 양도소득세 쪽 거주기간이 함께 움직인다. 비워 둔 집을 나중에 팔 때 그 집의 거주기간이 그 시점에서 끊기므로, 종부세
    절감과 미래 양도세 공제 손실을 같이 계산해야 한다.
  - |-
    1세대1주택자가 아닌 개인의 종부세 과세대상 문턱은 공시가격 합계 9억원 초과다(§7① 개정안). 합계가 9억원 이하이면 공제 산식과
    무관하게 종부세가 없다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: 국회 미통과이며, 산식의 세부 적용방법(거주주택 2채 이상, 인별/세대 합산, 지분 반영 시점)은 시행령 미정이다.
- id: adv.residence.unavoidable_reason_jongbuse
  title_ko: 이사할 수 없는 사정이 있다면 — 종부세에서 비거주 기간을 거주기간으로 인정받을 수 있다
  severity: opportunity
  when:
    track: reform
    is_one_house: true
    resides: false
    year_min: 2027
    price_total_min: 900000000
  basis:
  - 종합부동산세법 §9⑩ (개정안 신설)
  - 종합부동산세법 시행령 §4의5 (개정안 신설)
  - 2026년 세제개편안 상세본 p.91·p.92
  - 2026년 세제개편안 문답자료 p.60·p.61
  - 2026년 세제개편안 개조식 p.22
  fact_ko: |-
    개편안은 거주기간에 따른 공제를 적용할 때 부득이한 사유로 살지 못한 기간을 거주기간으로 인정하는 규정을 신설한다(종합부동산세법 §9⑩
    신설, 시행령 §4의5, 2027.1.1. 이후 납세의무 성립분). 종부세에서 인정되는 것은 두 가지다. ① 주거를 옮기는 날 현재 1년
    이상 계속 거주 중이던 주택에서 열거된 부득이한 사유로 다른 시·군으로 세대원 전부 또는 일부가 이전한 경우, 그로 인한 비거주 기간을 최장
    3년까지 거주기간으로 본다. 열거된 사유는 고등학교·대학교 취학, 직장 변경·전근 등 근무상 형편, 1년 이상의 치료·요양을 필요로 하는
    질병의 치료 또는 요양, 학교폭력 피해로 인한 전학, 국외 거주를 필요로 하는 취학·근무상 형편에 따른 출국, 60세 이상 직계존속
    동거봉양을 위한 합가, 그 밖에 이와 유사한 부득이한 사유다. ② 관리처분계획 인가일 현재 1년 이상 계속 거주 중이던 주택이
    재개발·재건축된 경우 인가일부터 신축주택 입주가능일까지 공사기간의 50%를 거주기간으로 인정한다. 이 인정은 1세대1주택자 거주공제의 공제율
    계산뿐 아니라 기본공제 산정 시 '거주용 주택'에 해당하는지 판단에도 적용된다(문답자료 p.60).
  advice_ko: |-
    전근·자녀 취학·질병 요양·부모 봉양으로 집을 비운 상태라면, 이사부터 서두르기 전에 세 요건이 모두 충족되는지 확인하라 — ① 나갈 당시
    그 집에 1년 이상 계속 살고 있었을 것, ② 열거된 사유에 해당할 것, ③ 다른 시·군으로 옮겼을 것(국외 사유라면 해외로 이전할 것).
    하나라도 빠지면 인정되지 않는다. 지금 당장 할 일은 서류 확보다. 전입·전출 이력이 모두 담긴 주민등록표 초본, 인사발령문·재직증명서,
    1년 이상 치료나 요양이 필요하다고 적힌 진단서, 학교폭력대책심의위원회 결정문, 출입국사실증명, 동거봉양 합가를 보여 주는 가족관계증명서와
    주민등록표 등본을 사유가 발생한 그 시점에 받아 두라. 시간이 지난 뒤에는 소급해 만들 수 없는 서류가 대부분이다.
  caveats_ko:
  - 국회 미통과다. 인정 사유의 구체적 범위와 증빙 방법은 종합부동산세법 시행령·시행규칙에 위임돼 있어 아직 정해지지 않았다.
  - |-
    인정 기간은 최장 3년이다. 3년을 넘는 비거주 기간은 인정되지 않으므로, 장기 해외 파견처럼 3년을 초과하는 경우 초과분만큼 거주기간이
    끊긴다.
  - |-
    '그 밖에 유사한 사유'는 자동으로 인정되지 않는다. 정부는 개별 사안별로 과세관청이 사실관계에 따라 인정 여부를 검토하겠다고
    밝혔다(문답자료 p.61). 열거되지 않은 사유라면 미리 확정할 수 없다.
  - |-
    적용시기가 양도소득세와 다르다. 종부세는 2027.1.1. 이후 납세의무 성립분부터, 양도세는 2028.1.1. 이후 양도분부터이고 인정
    대상 범위도 넓다(양도세는 특례주택 보유기간·등록임대주택 임대기간까지 포함). 한쪽에서 인정된 기간이 다른 쪽에서 자동으로 인정되지 않는다.
  - |-
    양도세에서는 이 거주기간 인정이 공제율 산정 시에만 적용되고 1세대1주택 비과세의 2년 거주요건에는 적용되지 않는다(상세본 p.85).
    종부세 쪽 인정을 근거로 비과세 요건이 채워졌다고 보면 안 된다.
  - |-
    이 엔진은 부득이한 사유를 자동으로 판정하지 않는다. 화면의 세액은 해당 기간을 비거주로 본 값이므로, 사유에 해당한다면 거주 여부·거주기간
    입력을 조정해 다시 계산해야 실제에 가까운 금액이 나온다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    국회 미통과이며, 시행령·시행규칙 미정이다. 특히 '기본공제 산정 시 거주용 주택 해당 여부'에까지 적용된다는 것은 개조식 p.22와
    문답자료 p.60의 설명에는 있으나 상세본 p.91의 조문 대조표는 세액공제 조문(§9⑩)만 제시하고 있어, 기본공제 조문(§8①)과의 연결
    방식이 확정되지 않았다.
- id: adv.residence.ltd_holding_three_year_gate
  title_ko: 거주 2년을 채워도 보유 3년이 안 되면 장기보유특별공제는 한 푼도 없다
  severity: caution
  when:
    transfer_planned: true
    is_one_house: true
  basis:
  - 소득세법 §95② 및 같은 항 표2
  - 소득세법 §95④
  - 소득세법 §97의2①
  - 2026년 세제개편안 상세본 p.57·p.58
  fact_ko: |-
    장기보유특별공제는 보유기간이 3년 이상인 자산에만 적용된다(소득세법 §95②). 1세대1주택 고가주택에 쓰이는 같은 항 표 2도 거주기간
    공제의 첫 구간인 '2년 이상 3년 미만 100분의 8'에 "보유기간 3년 이상에 한정함"이라는 괄호를 달아 두어, 보유 3년에 미달하면
    거주공제도 나오지 않는다. 개편안 역시 장기거주소득공제의 기본요건을 1세대1주택자는 '3년 이상 보유 + 2년 이상 거주', 다주택자는
    '3년 이상 보유'로 그대로 유지한다(상세본 p.57·p.58). 개편안이 없애는 것은 보유기간에 따른 공제율이지 보유 3년이라는 기본요건이
    아니다. 보유기간은 취득일부터 양도일까지로 계산한다(§95④).
  advice_ko: |-
    보유 3년이 되기 전에 팔 계획이라면 장기보유특별공제를 아예 0원으로 놓고 세액을 다시 계산하라. 실무에서 할 일은 ① 등기부와 매매계약서로
    취득일을 확정하고 3년이 되는 날짜를 달력에 찍은 뒤, ② 잔금일(양도일)을 그 날 이후로 옮길 수 있는지 매수인과 조율할 여지가 있는지
    확인하는 것이다. 며칠 차이로 공제율 전체가 붙고 떨어진다. 배우자나 직계존비속에게 증여받은 주택이라면 보유기간을 증여자의 취득일부터
    세므로(소득세법 §97의2①, §95④ 단서), 내 명의 기간만 보고 3년 미달로 단정하지 마라.
  caveats_ko:
  - |-
    1세대1주택 비과세의 보유요건 2년과 장기보유특별공제의 보유요건 3년은 별개다. 2년을 채워 비과세가 되더라도 양도가액 12억원 초과분에
    대한 공제는 3년을 채워야 나온다.
  - |-
    이 엔진은 거주기간 공제에 '보유 3년 이상' 단서를 걸어 두지 않았다. 보유 3년 미만인데도 화면에 거주기간 공제가 잡혀 있으면 공제가
    과대 계산되어 세액이 실제보다 낮게 표시된 것이므로, 보유기간 입력값과 공제액을 반드시 대조하라.
  - |-
    잔금일을 미루는 동안 조정대상지역 지정·해제, 세율·공제율 개정, 세대 구성 변동으로 다른 조건이 바뀔 수 있다. 3년 하나만 보고 미루면
    안 된다.
  - 미루는 기간만큼 재산세와 종합부동산세가 계속 발생한다. 공제로 얻는 이익과 추가 보유세를 함께 비교해야 한다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
- id: adv.residence.ltd_schedule_shift
  title_ko: 장기보유특별공제가 '장기거주소득공제'로 바뀐다 — 파는 연도가 공제율을 가른다
  severity: caution
  when:
    track: reform
    transfer_planned: true
    is_one_house: true
    year_min: 2027
  basis:
  - 소득세법 §95②·③ (개정안)
  - 소득세법 §95⑥ (개정안 신설)
  - 2026년 세제개편안 상세본 p.56·p.57·p.58·p.59
  - 2026년 세제개편안 개조식 p.17
  - 2026년 세제개편안 문답자료 p.36·p.37·p.38
  fact_ko: |-
    개편안은 주택의 장기보유특별공제를 '장기거주소득공제'로 개편해 보유공제를 거주공제로 단계적으로 전환한다(소득세법 §95②·③ 개정안,
    2028.1.1. 이후 양도분). 1세대1주택자의 공제율은 2027년 12월 31일까지는 현행대로 거주 연 4%(최대 40%)와 보유 연
    4%(최대 40%)를 합산하고, 2028년에는 거주 연 6%(최대 60%)와 보유 연 2%(최대 20%), 2029년부터는 거주 연
    8%(최대 80%)만 남는다. 다주택자(비조정대상지역)는 2027년까지 보유 연 2%(최대 30%), 2028년에는 보유 연 1%(최대
    15%)와 거주 연 2%(최대 30%) 중 높은 쪽, 2029년부터는 거주 연 2%(최대 30%)만 적용된다. 또한 현행에 없던 공제한도가
    신설돼 인별 연간 한도와 양도물건별 한도를 각각 2028년 20억원, 2029년 이후 10억원으로 적용한다(§95⑥ 신설).
  advice_ko: |-
    보유는 길고 거주는 짧은 집일수록 파는 연도가 세액을 크게 가른다. 그런 집은 현행 공제율이 그대로 살아 있는 2027년 12월 31일까지의
    양도에서 공제율이 가장 높고, 2029년 이후에는 거주기간만으로 공제율이 정해져 큰 폭으로 떨어진다. 반대로 지금부터 실거주를 시작하면
    2029년 이후 연 8%가 붙지만 최대 80%에 닿으려면 거주 10년이 필요하다. 판단 순서는 ① 매도 시점 분석에서
    2027·2028·2029년 세액을 나란히 놓고, ② 미루는 기간에 매년 내야 하는 재산세·종부세를 그 위에 더한 다음, ③ '지금 팔기'와
    '거주를 쌓고 팔기'의 손익분기 연도를 찾는 것이다. 양도일은 계약일이 아니라 대금청산일이므로(소득세법 §98), 12월 말 잔금은 다음
    해로 넘어가 공제 단계가 한 칸 내려간다 — 잔금일을 연말·연초 중 어디로 잡을지 매수인과 미리 합의하라.
  caveats_ko:
  - 국회 미통과다. 2028년·2029년으로 나뉜 시행 단계가 국회 심의 과정에서 조정될 수 있다.
  - 개편안 적용시기는 2028년 1월 1일 이후 양도분이다. 2027년 중 양도에는 현행 공제율이 그대로 적용된다(시행이 1년 유예된 결과다).
  - |-
    공제한도는 인별 연간 한도와 양도물건별 한도를 각각 적용하며, 공동소유나 분할양도의 경우 지분비율·분할양도비율로 안분된다. 부부 공동명의라고
    해서 한도가 단순히 두 배가 되지 않는다.
  - 다주택자가 조정대상지역 소재 주택을 양도하면 장기보유특별공제 자체가 배제되며, 개편안에서도 거주공제까지 함께 배제된다.
  - |-
    매도를 미루는 동안 종합부동산세 쪽에서는 공정시장가액비율 인상(60%→70%→80%)과 세부담 상한 완화(150%→200%)가 진행된다.
    양도세만 보고 시점을 정하면 총부담이 뒤집힐 수 있다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: 국회 미통과다.
- id: adv.residence.regulated_zone_two_year_residence
  title_ko: 취득 당시 조정대상지역이었다면 — 2년을 실제로 살아야 비과세가 열린다
  severity: caution
  when:
    is_one_house: true
    resides: false
    transfer_planned: true
    in_regulated_zone: true
  basis:
  - 소득세법 §89①3
  - 소득세법 시행령 §154①
  - 소득세법 시행령 §155의3 (개정안)
  - 2026년 세제개편안 상세본 p.78·p.85
  - 2026년 세제개편안 문답자료 p.58
  - 2026년 세제개편안 개조식 p.21
  fact_ko: |-
    1세대1주택 비과세는 2년 이상 보유를 요건으로 하되, 취득 당시 조정대상지역에 있던 주택은 2년 이상 거주까지 해야 적용된다(소득세법
    §89①3, 시행령 §154①). 요건 충족 여부는 취득 시점의 지정 여부로 판단하므로, 그 뒤 조정대상지역에서 해제되었더라도 거주요건은
    남는다. 개편안이 신설하는 '비거주 기간을 거주기간으로 인정'하는 규정은 공제율 산정 시에만 적용되고 이 2년 거주요건에는 적용되지 않는다고
    명시돼 있다(상세본 p.85). 한편 거주요건을 면제해 주던 상생임대주택 특례는 적용기한이 2026년 12월 31일로 종료되고, 개편안은
    상생임대차계약 종료 후 1년 내 양도분만 면제를 인정하도록 좁힌다 — 2026년 12월 31일 이전에 계약이 종료되면 2027년 12월
    31일까지, 2027년 1월 1일 이후 종료되면 계약 종료 후 1년이 되는 날과 2029년 12월 31일 중 빠른 날까지다(소득세법 시행령
    §155의3 개정안, 상세본 p.78).
  advice_ko: |-
    가장 먼저 확정할 것은 '현재'가 아니라 '취득 당시' 조정대상지역이었는지다 — 이 엔진의 지역 판정은 현재 시점 기준이므로,
    매매계약일·잔금일을 기준으로 당시 지정 여부를 국토교통부 공고로 별도 확인하라. 조정대상지역 취득분인데 실제 거주가 2년에 못 미친다면
    선택지는 셋이다. ① 양도 전에 전입해 2년을 채운 뒤 판다. ② 2026년 12월 31일까지 상생임대차계약을 체결하고 임대를 개시해 요건을
    갖춘 뒤, 계약 종료 후 1년 안에 판다 — 계약 자체가 2026년 안에 시작돼야 하므로 결정 시한이 이미 임박했다. ③ 거주요건을 포기하고
    비과세 없이 판다. 세 안의 세액을 각각 계산해 나란히 비교한 뒤 결정하라.
  caveats_ko:
  - |-
    상생임대주택 특례는 직전 임대차(1년 6개월 이상) 대비 임대료 인상률 5% 이내, 2년 이상 상생임대 등 요건이 모두 충족돼야
    한다(문답자료 p.58). 계약서만 새로 쓰는 것으로는 인정되지 않는다.
  - 상생임대차계약 종료 후 1년 내 양도라는 제한은 개편안 내용이며 국회 미통과다. 통과 여부에 따라 매도 시한이 달라진다.
  - |-
    거주요건을 채우려고 전입하면 그동안 임대수입이 끊기고, 임차인이 있으면 계약갱신요구를 거절해야 한다. 임대인 실거주를 이유로 거절한 뒤
    정당한 사유 없이 2년 안에 제3자에게 임대하면 손해배상 책임이 발생한다(주택임대차보호법 §6의3①8·⑤·⑥).
  - |-
    비과세는 양도가액 12억원 이하 부분에만 적용된다. 12억원 초과분은 거주요건을 채워도 과세되며, 그 부분의 공제율은 거주기간에 따라 따로
    정해진다.
  - |-
    이 조언은 '현재 조정대상지역 주택 보유'로 매칭된 것이다. 취득 당시 비조정대상지역이었다면 거주요건 자체가 없으므로 이 항목은 해당하지
    않는다.
