entries:
- id: adv.household.property_tax_household_split
  title_ko: 재산세에서는 2주택이 아닐 수 있다 — 혼인 5년, 동거봉양 합가
  severity: opportunity
  when:
    house_count: 2
    is_one_house: false
  basis:
  - 지방세법 §111의2①
  - 지방세법 §114
  - 지방세법 시행령 §110의2①9
  - 지방세법 시행령 §110의2②2
  - 지방세법 시행령 §110의2③1
  - 지방세법 시행령 §110의2③2
  fact_ko: |-
    재산세 1세대1주택 세율 특례의 세대·주택 수 판정에는 종부세에 없는 두 갈래 예외가 있다. ① 혼인 전부터 소유한 주택으로서 과세기준일
    현재 혼인일로부터 5년이 경과하지 않은 주택은 주택 수에서 제외한다. 다만 혼인 전부터 각각 최대 1개의 주택만 소유했고 혼인 후 주택을
    추가로 취득하지 않은 경우로 한정하며, 이에 해당하면 그중 시가표준액이 높은 주택을 1세대1주택으로 본다(지방세법 시행령 §110의2①9,
    ②2). ② 과세기준일 현재 65세 이상의 직계존속(배우자의 직계존속을 포함하며, 직계존속 중 어느 한 사람이 65세 미만인 경우를
    포함한다)을 동거봉양하기 위하여 19세 이상의 직계비속 또는 혼인한 직계비속이 합가한 경우에는 각각 별도의 세대로 본다(같은 조 ③1).
    취학·근무상 형편 등으로 세대 전원이 90일 이상 출국하면서 출국 후 거주지를 다른 가족의 주소로 신고한 경우도 별도 세대로 본다(③2).
    재산세 과세기준일은 매년 6월 1일이다(지방세법 §114).
  advice_ko: |-
    이 엔진은 혼인일과 직계존속의 연령·합가 사유를 입력받지 않으므로 화면의 재산세는 두 예외를 적용하지 않은 값이다. 서류로 직접 대조하라.
    혼인 경로 — ⓐ 두 주택 모두 혼인신고일 이전에 취득했는지, ⓑ 혼인 후 추가 취득이 없는지, ⓒ 올해 6월 1일이 혼인일로부터 5년
    이내인지를 가족관계증명서와 등기부로 확인한다. 셋 다 맞으면 시가표준액이 더 높은 주택 한 채가 1세대1주택으로 판정되어, 그 주택의
    시가표준액이 9억원 이하이면 특례세율 대상이다. 동거봉양 경로 — ⓐ 6월 1일 현재 직계존속이 65세 이상인지, ⓑ 합가한 직계비속이
    19세 이상이거나 혼인했는지, ⓒ 실제 동거봉양 목적의 합가인지를 확인한다. 어느 쪽이든 7월·9월 고지서에 특례세율이 빠져 있으면
    가족관계증명서와 주민등록등본을 갖춰 관할 시·군·구에 정정(경정)을 요청하고, 다음 해부터는 6월 1일 이전에 세대 구성을 정리해 두라.
  caveats_ko:
  - |-
    배우자와 과세기준일 현재 미혼인 19세 미만 자녀는 같은 세대별 주민등록표에 기재돼 있지 않더라도 1세대로 본다(지방세법 시행령
    §110의2③ 본문). 주소를 옮기는 방식의 세대분리로는 부부의 주택 수가 나뉘지 않는다.
  - |-
    혼인 후 주택을 하나라도 추가 취득하면 혼인 5년 제외가 통째로 적용되지 않는다. 분양권·입주권으로 취득한 신축주택이 추가 취득에
    해당하는지는 개별 확인이 필요하다.
  - |-
    혼인 5년이 지나면 자동으로 2주택이 되어 특례세율이 사라진다. 세액이 계단식으로 뛰는 과세기준일이 미리 정해져 있으니 그해 예산을 미리
    잡아야 한다.
  - 동거봉양은 실제 사실이 있어야 한다. 세금만을 위한 형식적 전입은 사실관계 확인 과정에서 부인될 수 있다.
  - 판정 기준일은 6월 1일이다. 6월 2일 이후에 합가하거나 직계존속이 65세가 되면 그해에는 반영되지 않는다.
  - |-
    이것은 재산세 세율 특례 판정 규칙이다. 종부세 1세대1주택자 판정(종합부동산세법 시행령 §2의3①)과 양도소득세 1세대1주택 비과세는 근거
    조문이 달라 이 예외가 그대로 적용되지 않는다.
  - 주택 수에서 빠지더라도 남은 주택의 시가표준액이 9억원을 넘으면 특례세율은 적용되지 않는다(지방세법 §111의2①).
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    혼인일, 각 주택의 취득 시기, 직계존속의 연령·합가 사유는 이 엔진의 입력 항목이 아니어서 요건 충족 여부를 판정하지 못한다. 여기서는
    규정의 존재와 확인 방법만 알린다.
- id: adv.household.single_to_joint_conversion
  title_ko: 단독명의를 부부공동명의로 바꾸기 전에 — 종부세만 보면 전환 효과는 0이다
  severity: caution
  when:
    is_one_house: true
    joint_spouse_eligible: false
    price_total_min: 1200000000
  basis:
  - 종합부동산세법 §8①
  - 종합부동산세법 §9⑤⑥⑧
  - 종합부동산세법 §10①
  - 종합부동산세법 §10의2③
  - 종합부동산세법 시행령 §5의2⑥⑧
  - 소득세법 §97의2①
  - 지방세법 §111의2①
  fact_ko: |-
    단독명의 1주택자는 이미 1세대1주택자로서 기본공제와 연령·보유기간 세액공제를 받고 있다(종합부동산세법 §8①1, §9⑤⑥⑧). 이 집을
    부부공동명의로 바꾼 뒤 §10의2 특례를 신청하면 배우자 소유 주택지분을 합산해 다시 1세대1주택자로 계산되므로(종합부동산세법 §10의2③,
    시행령 §5의2⑥) 종부세 과세표준은 전환 전과 같아진다. 즉 종부세에서 전환의 효과는 특례를 신청하지 않고 부부가 각자
    기본공제(§8①3)를 받는 경우에만 생기고, 그 경우 1세대1주택자 세액공제는 받지 못한다. 특례를 신청하면 세액공제는 공동명의 1주택자로
    지정된 사람의 연령과 보유기간을 기준으로 한다(시행령 §5의2⑧).
  advice_ko: |-
    전환을 검토한다면 순서를 이렇게 잡으라. ① 지금 세액(단독명의, 현재 연령·보유기간 기준)을 기준선으로 고정하고, ② 전환 후 '특례
    신청'과 '특례 미신청' 두 경우를 각각 계산해 연간 절감액을 구한다 — 특례를 신청하는 시나리오에서는 과세표준이 전환 전과 같으므로
    절감액이 사실상 0으로 나온다는 점을 먼저 확인하라. ③ 그다음 증여세·취득세·등기비용·법무사 보수를 합한 전환 비용을 연간 절감액으로 나눠
    회수기간을 구한다. 회수기간이 앞으로의 예상 보유기간보다 길면 전환하지 않는 것이 맞다. 계산은 종부세만이 아니라 재산세와 실제로 팔 계획인
    시점의 양도세까지 합산해서 비교하라.
  caveats_ko:
  - |-
    배우자에게 지분을 증여하면 배우자 증여재산공제(상속세 및 증여세법 §53) 한도를 넘는 부분에 증여세가 부과된다. 이 엔진은 증여세를
    계산하지 않는다.
  - |-
    증여로 인한 취득에도 취득세가 붙고, 조정대상지역의 일정 가액 이상 주택 증여는 중과 대상이 될 수 있다. 취득세는 이 엔진의 계산 범위
    밖이다.
  - |-
    증여받은 지분을 10년 이내에 양도하면 이월과세로 취득가액이 증여자의 취득가액으로 되돌아간다(소득세법 §97의2①). 보유세를 줄이려다
    양도세가 더 늘어날 수 있으므로 매도 계획과 함께 판단해야 한다.
  - |-
    특례를 신청하면 세액공제는 지정된 1명의 연령·보유기간만 본다(시행령 §5의2⑧). 지분을 새로 받은 배우자를 지정하면 보유기간이 처음부터
    다시 쌓인다.
  - |-
    전환 후 특례를 신청하지 않고 각자 기본공제를 받는 방식은 1세대1주택자 세액공제를 포기하는 선택이다. 고령·장기보유 구간에 가까울수록
    손해가 커진다.
  - |-
    종부세 세부담 상한은 직전연도 세액을 기준으로 하므로(종합부동산세법 §10), 명의 구성을 바꾼 해에는 비교 기준 자체가 달라져 상한의
    보호를 기대하기 어렵다.
  - |-
    재산세 1세대1주택 특례세율은 주택 전체 시가표준액 9억원 이하에만 적용되므로(지방세법 §111의2①), 명의를 나눠도 재산세는 달라지지
    않는다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    증여세·취득세·등기비용은 이 엔진의 계산 범위 밖이라 회수기간 계산에 필요한 전환 비용은 별도로 확인해야 한다. 조정대상지역 증여 취득세
    중과 해당 여부도 이 엔진이 판정하지 않는다.
