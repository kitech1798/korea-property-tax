# 부부공동명의 1주택자 특례 (종부세법 §10의2)
#
# ⚠️ 이 파일은 tools/build_advisory.py가 생성한다. 직접 고치지 말 것.
#    원본: docs/audit/2026-08-04_advisory_draft.json
#
# 인용된 조문은 법제처 조문 API 원문으로 대조했다. 대조하지 못한 항목은
# 넣지 않는다 — 그럴듯한 것보다 없는 게 낫다.

entries:
- id: adv.joint_spouse.designate_elder
  title_ko: 특례를 신청한다면 '누구를 공동명의 1주택자로 정하느냐'가 세액을 가른다
  severity: opportunity
  when:
    joint_spouse_eligible: true
    age_min: 60
  basis:
  - 종합부동산세법 §9⑤⑥⑧
  - 종합부동산세법 §10의2①③
  - 종합부동산세법 시행령 §5의2③⑧
  fact_ko: |-
    공동명의 1주택자는 그 주택을 소유한 세대원 1명과 그 배우자 중 공동소유자 간 합의로 정한 사람이다(종합부동산세법 시행령 §5의2③).
    특례를 적용할 때 1세대1주택자 세액공제는 '공동명의 1주택자의 연령 및 보유기간'을 기준으로 정한다(시행령 §5의2⑧). 연령공제는 만
    60세 이상 20%·만 65세 이상 30%·만 70세 이상 40%(종합부동산세법 §9⑥), 보유기간공제는 5년 이상 20%·10년 이상
    40%·15년 이상 50%(§9⑧)이며 둘을 합쳐 80%까지 중복 적용된다(§9⑤ 후단). 같은 집·같은 지분이라도 부부 중 누구를
    지정하느냐에 따라 공제율이 0%가 될 수도 80%가 될 수도 있다.
  advice_ko: |-
    신청서에 이름을 올릴 사람을 정하기 전에, 부부 각각을 공동명의 1주택자로 지정한 두 경우를 따로 계산해 비교하라. 이 화면의 세액은 지금
    선택된 사람을 지정했을 때의 값이므로, 배우자를 기준 인물로 바꿔 한 번 더 돌려야 반대쪽 값이 나온다. 확인할 것은 두 가지다 — ①
    과세기준일(6월 1일) 현재 연령 구간(60·65·70세)이 더 높은 쪽, ② 그 주택 지분을 실제로 더 오래 보유한 쪽. 두 조건이 서로
    다른 사람을 가리키면 합산 공제율이 큰 쪽이 답이고, 이미 합계 80%에 닿는 사람이 있으면 그 사람으로 끝난다. 지정을 바꾸려면 신청한
    다음 해부터 9월 16~30일에 변경신청을 해야 한다(시행령 §5의2⑤).
  caveats_ko:
  - |-
    지정된 사람이 그 주택 전체의 납세의무자가 된다. 세액공제가 커져도 고지서는 그 사람 앞으로 전부 나오므로, 배우자 지분 몫의 납부 자금을
    어떻게 정산할지 미리 정해야 한다.
  - |-
    보유기간은 지정된 사람 기준으로 본다(시행령 §5의2⑧). 뒤늦게 지분을 증여받아 공동명의가 된 배우자를 지정하면 보유기간이 처음부터 다시
    쌓여 오히려 공제가 줄어든다 — 이 함정이 '고령자를 지정하면 유리하다'는 통념을 뒤집는 지점이다.
  - 연령공제는 과세기준일 현재의 만 나이로 판단한다. 6월 1일 직후에 생일이 오는 사람은 그해에는 아직 아래 구간이다.
  - 지정에는 공동소유자 간 합의가 필요하다(시행령 §5의2③). 한쪽이 단독으로 정할 수 없다.
  - 연령공제와 보유기간공제를 합쳐도 80%가 상한이다(§9⑤ 후단). 이미 80%에 도달한 부부라면 지정자를 바꿔도 더 줄지 않는다.
  - 세액공제는 1세대1주택자에게만 주어지므로, 특례를 신청하지 않으면 부부 어느 쪽도 이 공제를 받지 못한다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    이 엔진은 각 배우자의 지분별 보유기간을 따로 입력받지 않는다. 지분을 서로 다른 시점에 취득한 부부라면 지정자별 보유기간을 직접 확인해야
    한다.
- id: adv.joint_spouse.election_deadline
  title_ko: 특례 신청·변경은 9월 16~30일 한 창구에서 — 합산배제 신고도 같은 기간이다
  severity: caution
  when:
    joint_spouse_eligible: true
    track: current
  basis:
  - 종합부동산세법 §8③⑤
  - 종합부동산세법 §10의2②
  - 종합부동산세법 시행령 §5의2④⑤
  fact_ko: |-
    부부공동명의 1주택자 특례를 적용받으려는 납세의무자는 해당 연도 9월 16일부터 9월 30일까지 관할세무서장에게 신청하여야
    한다(종합부동산세법 §10의2②). 신청은 재정경제부령이 정한 공동명의 1주택자 신청서로 한다(시행령 §5의2④). 한 번 신청하면 그다음
    해부터는 정해진 사항이 변경된 경우에만 같은 기간에 변경신청을 하면 된다(시행령 §5의2⑤). 같은 9월 16~30일에 합산배제 주택의
    보유현황 신고(§8③)와 일시적 2주택·상속주택·지방 저가주택의 1세대1주택자 간주 특례 신청(§8⑤)도 이루어진다.
  advice_ko: |-
    9월 16일이 열리기 전, 늦어도 8월 안에 세 가지를 끝내 두라. ① 그해 공시가격·연령·보유기간으로 신청/미신청을 다시 계산한다 —
    유불리는 해마다 뒤집히므로 작년 결론을 그대로 쓰면 안 된다. ② 이미 신청해 둔 부부는 그해에 지분 변동·이혼·세대 변동·다른 주택 취득이
    있었는지 점검하고, 있었다면 같은 기간에 변경신청을 한다. ③ 상속주택·일시적 2주택·지방 저가주택 특례나 합산배제 신고 대상이 함께 있으면
    목록을 만들어 한 번에 접수한다 — 기간이 겹치므로 하나를 놓치면 나머지도 함께 늦는다. 신청 자체는 홈택스 또는 관할세무서에서 한다.
  caveats_ko:
  - 신청기간이 법률에 특정돼 있으므로 기한 후 신청은 원칙적으로 인정되지 않는다. 12월 고지서를 받고 나서 바꾸려 해도 그 해에는 늦다.
  - 이미 신청해 둔 상태에서 그해에는 미신청이 유리해졌더라도 자동으로 되돌아가지 않는다. 신청 이후에도 매년 다시 계산해야 한다.
  - |-
    부부가 그 집 외에 다른 주택을 취득했거나 세대원이 주택을 취득하면 특례 요건 자체가 깨진다(시행령 §5의2②). 요건이 깨진 채로 신청
    상태를 유지하면 추징 대상이 된다.
  - |-
    배우자가 다른 주택의 부속토지(주택의 건물과 부속토지 소유자가 다른 경우의 그 부속토지)를 소유하고 있으면 요건에서 제외된다(시행령
    §5의2② 단서). 부속토지는 등기부에서 따로 확인해야 드러난다.
  - 부부 중 한 사람이라도 소득세법상 거주자가 아니면 요건을 충족하지 못한다(시행령 §5의2②).
  - 특례 신청은 종부세 규정이다. 재산세 고지·납부 일정(7월·9월)과는 별개이며, 신청한다고 재산세 고지가 합쳐지지 않는다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
- id: adv.joint_spouse.reform_deduction_gap
  title_ko: 개편안에서는 '그 집에 사느냐'가 부부공동명의의 유불리를 뒤집는다
  severity: caution
  when:
    joint_spouse_eligible: true
    track: reform
    year_min: 2027
  basis:
  - 종합부동산세법 §8① (2026.8.3. 개편안)
  - 종합부동산세법 §10의2③
  - 종합부동산세법 시행령 §5의2⑥
  - 2026년 세제개편안 상세본 p.61
  - 2026년 세제개편안 문답자료 p.40
  fact_ko: |-
    2026.8.3. 세제개편안은 종부세 기본공제를 거주 여부로 나눈다. 1세대1주택자는 거주하면 14억원, 거주하지 않으면 9억원이고, 그 외
    납세의무자는 '4억원 + 5억원 × (거주주택 공시가격 ÷ 주택 공시가격 합계액)'이다(종합부동산세법 §8① 개정안, 상세본 p.61).
    부부가 특례를 신청하지 않으면 각자는 '그 외 납세의무자'이므로 이 산식을 각자 적용받는다 — 정부 문답자료 p.40은 본인과 배우자가
    1주택만 공동소유하는 경우를 직접 예시해, 부부가 개별적으로 납부하면 그 주택에 거주 시 각 9억원, 비거주 시 각 4억원을 공제받고,
    1세대1주택자 특례를 신청하면 거주 시 14억원, 비거주 시 9억원을 공제받는다고 밝힌다. 적용시기는 2027.1.1. 이후 납세의무가
    성립하는 분부터다.
  advice_ko: |-
    거주 여부를 사실대로 입력한 뒤 현행·개편안 두 트랙을 나란히 놓고 결정하라. 방향은 정반대로 갈린다. ① 부부가 그 집에 실제로 살면
    개별납부 시 기본공제 합계가 9억+9억=18억이 되어 특례 신청(14억)보다 4억 크므로, 연령·보유기간 세액공제가 그 4억 차이를 넘어설
    때만 신청이 유리하다. ② 그 집에 살지 않으면 개별납부는 4억+4억=8억으로 줄어 특례 신청(9억)이 기본공제 단계부터 이미 유리하다.
    결론은 세액공제까지 포함한 완전 계산으로 확정하고, 개편안이 시행된 해의 9월 16~30일에 신청하라. 지금 할 일은 명의를 옮기는 것이
    아니라 두 트랙 결과를 연도별로 기록해 두는 것이다.
  caveats_ko:
  - |-
    개편안은 국회 미통과다. 통과 여부와 최종 문언에 따라 금액·산식이 바뀔 수 있으므로 이 수치를 전제로 지분을 옮기는 등 되돌리기 어려운
    결정을 하지 말 것.
  - |-
    다주택자 공식의 '거주주택 비중' 산정방법(분모가 세대 합계인지 인별 합산인지, 지분 반영 전 금액인지 후 금액인지)은 시행령에 위임돼 아직
    정해지지 않았다. 개별납부 시 각 4억원·각 9억원이라는 결과도 이 해석에 달려 있다.
  - |-
    거주 여부를 유리한 쪽으로 가정하지 말 것. 실제 거주와 주민등록이 어긋나면 공제가 5억원 단위로 뒤집힌다. 이 엔진은 거주 여부를 모르면
    '거주하지 않는 것'으로 본다.
  - 2027.1.1. 이후 납세의무 성립분부터 적용되므로 2026년 종부세에는 적용되지 않는다. 올해 신청 판단은 현행법 트랙으로 해야 한다.
  - 개편안은 세액공제도 보유기간 기준에서 거주기간 기준으로 전환하고 공제금액 한도를 신설한다. 기본공제만 보고 유불리를 판단하면 틀린다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    2026.8.3. 세제개편안 기준이며 국회 미통과 상태다. 거주주택 비중 산정방법은 시행령 미제정이라 개별납부 시 공제액 계산에 해석의
    여지가 남아 있다.
- id: adv.joint_spouse.property_tax_is_separate
  title_ko: 재산세는 특례 신청과 무관하게 지분대로 나온다 — 감사추적의 재산세 공제가 두 배로 보여도 오류가 아니다
  severity: fact
  when:
    joint_spouse_eligible: true
  basis:
  - 지방세법 §107①1
  - 지방세법 §111의2①③④
  - 지방세법 시행령 §110의2④
  - 종합부동산세법 시행령 §5의2⑦
  fact_ko: |-
    재산세는 공유재산인 경우 그 지분에 해당하는 부분에 대해 지분권자가 납세의무를 진다(지방세법 §107①1). 재산세 1세대1주택 세율 특례의
    주택 수는 '1개의 주택을 같은 세대 내에서 공동소유하는 경우에는 1개의 주택으로 본다'는 규칙으로 세므로(지방세법 시행령 §110의2④
    단서), 부부공동명의 1주택도 특례세율 판정 대상은 된다. 다만 특례세율은 시가표준액 9억원 이하인 주택에 한정되고(지방세법
    §111의2①), 이 9억원은 지분이 아니라 주택 전체의 시가표준액으로 판단한다. 종부세의 §10의2 특례 신청은 종부세 납세의무자를 정하는
    규정이지 재산세 고지를 합치는 규정이 아니다.
  advice_ko: |-
    부부공동명의라도 7월·9월 재산세 고지서는 각자 지분대로 따로 나온다는 전제로 납부 계획을 세우라. 특례세율 적용 여부는 지분이 아니라 주택
    전체의 시가표준액이 9억원 이하인지로 먼저 확인하고, 9억원을 넘으면 지분을 어떻게 나눠도 특례세율은 적용되지 않는다. 그리고 종부세 특례를
    신청한 해에는 종부세에서 공제하는 재산세액과 세부담 상한이 '내 지분분'이 아니라 '해당 과세대상 1주택 지분 전체'로
    계산되므로(종합부동산세법 시행령 §5의2⑦), 감사추적의 재산세 공제 항목이 내 지분 기준의 두 배로 표시되더라도 계산 오류로 보고 신고할
    필요가 없다.
  caveats_ko:
  - 시가표준액 9억원 초과 주택은 부부가 절반씩 나눠 가져도 재산세 특례세율을 받지 못한다. 공동명의 전환은 재산세를 줄이는 수단이 아니다.
  - |-
    재산세 세율특례의 1세대1주택 판정(지방세법 시행령 §110의2)과 종부세 1세대1주택자 판정(종합부동산세법 시행령 §2의3①)은 근거
    법령이 달라 각각 따로 이뤄진다. 한쪽에서 인정됐다고 다른 쪽도 자동으로 인정되지 않는다.
  - |-
    지방자치단체가 조례로 가감한 세율을 적용한 세액이 특례세율을 적용한 세액보다 적으면 특례세율을 적용하지 않는다(지방세법 §111의2③).
    지역에 따라 결과가 달라질 수 있다.
  - 1세대1주택 특례세율과 지방세특례제한법상 재산세 경감은 중복 적용되지 않고 경감 효과가 큰 하나만 적용된다(지방세법 §111의2④).
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
- id: adv.joint_spouse.transfer_split_benefit
  title_ko: 팔 때는 공동명의가 유리하다 — 다만 지금 명의를 나눠도 10년은 소용없다
  severity: opportunity
  when:
    joint_spouse_eligible: true
    transfer_planned: true
  basis:
  - 소득세법 §55①
  - 소득세법 §89①3
  - 소득세법 §95②④
  - 소득세법 §97의2①
  - 소득세법 §103①
  - 2026년 세제개편안 상세본 p.68
  - 2026년 세제개편안 문답자료 p.48
  fact_ko: |-
    양도소득세는 거주자별로 과세한다. 양도소득 기본공제는 소득별로 각 거주자에게 연 250만원씩 적용되고(소득세법 §103①), 세율은 각자의
    과세표준에 누진세율을 적용한다(소득세법 §55①, §104①). 따라서 부부공동명의 주택을 양도하면 양도차익이 지분대로 나뉘어 각자 낮은
    누진 구간에서 과세되고 기본공제도 각각 받는다. 2026.8.3. 개편안은 10년 이상 거주한 양도가액 30억원 이하 1세대1주택의
    기본공제를 연 2,500만원으로 올리면서 인별·양도물건별로 안분 적용하되 '부부공동명의는 각각 적용'한다고 명시한다(상세본 p.68,
    문답자료 p.48). 반면 1세대1주택 비과세는 양도 당시 실지거래가액 12억원을 초과하는 고가주택을 제외하고 적용되며(소득세법
    §89①3), 이 12억원은 세대와 주택 단위여서 지분을 나눠도 늘어나지 않는다.
  advice_ko: |-
    이미 공동명의라면 신고는 부부가 각자 자기 지분의 양도차익으로 따로 하고, 지분 비율은 등기부상 비율을 그대로 쓴다. 반대로 '팔기 전에
    배우자에게 지분을 넘겨 공동명의로 만들자'는 방안은 대개 성립하지 않는다 — 증여일부터 10년 이내에 양도하면 이월과세로 취득가액이 증여자의
    취득가액으로 되돌아가고(소득세법 §97의2①), 보유기간도 증여한 배우자가 취득한 날부터 기산되므로(소득세법 §95④ 단서) 나누는 효과가
    사라지고 증여세·취득세만 남는다. 매도 시점을 정할 때는 양도 시나리오를 입력해 현행·개편안 두 트랙으로 매도 연도별 총비용(양도세 +
    그때까지 낸 보유세)을 비교하고, 10년 이상 거주 + 양도가액 30억원 이하 요건이 임박했다면 그 요건을 채우는 시점과 잔금일을 맞출지
    계산으로 판단하라.
  caveats_ko:
  - 1세대1주택 비과세의 12억원 한도는 세대·주택 기준이다. 공동명의로 나눠도 비과세 금액이 두 배가 되지 않는다.
  - |-
    장기보유특별공제는 보유기간 3년 이상인 자산에만 적용된다(소득세법 §95②). 거주기간만 채우고 보유기간이 3년에 못 미치면 거주기간 공제도
    받지 못한다.
  - |-
    개편안의 연 2,500만원 기본공제는 국회 미통과다. 특수관계인 간 양도와 비거주자는 적용 대상에서 제외되고, 연 250만원 초과분은 해당
    1주택 양도분에서만 공제된다.
  - 이 엔진은 취득세·증여세·중개보수 등 거래비용을 계산하지 않는다. 지분 이동을 수반하는 방안은 그 비용을 따로 확인해야 한다.
  - 공동명의 주택을 여러 해에 걸쳐 분할 양도하면 공제액이 분할양도 비율로 안분된다. 한 번에 양도하는 경우를 전제로 계산했는지 확인하라.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    개편안의 장기거주 1세대1주택 기본공제 확대(연 2,500만원, 부부 각각 적용)는 2026.8.3. 세제개편안 내용으로 국회 미통과
    상태다.
