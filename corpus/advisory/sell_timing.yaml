entries:
- id: adv.sell_timing.heavy_relief_window
  title_ko: 2027~2028년, 조정대상지역 다주택 매도 창구가 한시적으로 열린다
  severity: opportunity
  when:
    is_one_house: false
    in_regulated_zone: true
    transfer_planned: true
    track: reform
  basis:
  - 소득세법 §104⑦ (2026년 세제개편안 개정안, 단서 신설)
  - 소득세법 §95②
  - 소득세법 §98
  - 2026년 세제개편안 상세본 p.72
  - 2026년 세제개편안 개조식 p.20
  - 2026년 세제개편안 문답자료 p.53
  fact_ko: |-
    개편안은 다주택자가 조정대상지역 소재 주택을 양도할 때 붙는 중과세율을 2027·2028년 양도분에 한해 낮춘다. 1세대2주택은 기본세율
    +20%p에서 2027년 +5%p·2028년 +10%p로, 1세대3주택 이상은 +30%p에서 2027년 +10%p·2028년 +15%p로
    완화되고, 2029년 이후 양도분은 현행 수준(+20%p / +30%p)으로 돌아간다. 보유기간 2년 이상인 양도분에만 적용된다. 정부가
    밝힌 개정 이유는 '다주택자 보유세 정상화에 따른 매도 기회 부여'다(소득세법 §104⑦ 개정안, 상세본 p.72).
  advice_ko: |-
    이 창구를 쓰려면 '언제'와 '어느 집을 먼저'를 같이 정해야 한다. ① 양도가액·취득가액·필요경비·취득일을 입력해
    2027·2028·2029년 각각의 총비용(그해 양도세 + 그때까지 누적된 보유세)을 계산하고 가장 낮은 해를 고른다 — 완화 폭이 큰 해가
    늘 답은 아니다. 버틸수록 보유세가 쌓이기 때문이다. ② 여러 채를 팔 계획이면 처분 순서를 정하라. 먼저 파는 집이 중과를 맞고 남은 집이
    1세대1주택 혜택을 얻으므로, 순서를 바꾼 두 시나리오의 총액을 각각 계산해 비교해야 한다. ③ 실행 단계에서 가장 흔한 사고는 잔금일이다
    — 양도일은 계약일이 아니라 대금청산일(불분명하면 등기접수일)이므로(소득세법 §98) 12월 말 잔금은 다음 해로 넘어가 완화 구간을 통째로
    놓칠 수 있다. 잔금일을 11월까지로 당기거나 계약서에 날짜를 못 박아라.
  caveats_ko:
  - |-
    완화되더라도 장기보유특별공제는 여전히 배제된다(소득세법 §95②). 문답자료 p.53이 '현행 양도소득세 중과와 동일하게 한시 완화 기간 중
    장기보유특별공제 미적용'이라고 못 박았다 — '세율이 내려갔으니 공제도 살아난다'는 오해가 가장 흔하다.
  - |-
    보유기간 2년 미만이면 완화 대상이 아니고, 소득세법 §104⑦ 후단에 따라 중과세율로 계산한 세액과 2년 미만 단일세율(주택 60%)로
    계산한 세액 중 큰 쪽을 낸다.
  - 조정대상지역 밖 주택은 애초에 중과 대상이 아니다. 완화는 조정대상지역 물건에만 의미가 있다.
  - |-
    2029년 전에 해당 지역이 조정대상지역에서 해제되면 중과 자체가 사라지고, 반대로 새로 지정될 수도 있다. 지정 상태는 잔금 직전에 다시
    확인해야 한다.
  - 매도 대금의 자금 계획(대체 주택 취득세, 전세보증금 반환, 대출 중도상환수수료)과 건강보험료 변동은 이 총비용에 들어 있지 않다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    국회 미통과 — 2026.8.3. 세제개편안 단계의 개정안이다. 정기국회 심의에서 세율·기간이 바뀌거나 부결될 수 있고, 그 경우
    2027년에도 현행 +20%p/+30%p가 그대로 적용된다. 엔진이 current(현행법)와 reform(개편안) 두 트랙을 나란히
    계산하므로 두 값의 차이를 함께 보라.
- id: adv.sell_timing.holding_2y_gate
  title_ko: 보유 2년을 못 채우면 완화 창구가 닫히고 60% 단일세율과 비교당한다
  severity: caution
  when:
    is_one_house: false
    in_regulated_zone: true
    transfer_planned: true
  basis:
  - 소득세법 §104⑦ 후단
  - 소득세법 §104①2호·3호
  - 소득세법 §104②1호
  - 소득세법 §95② 및 같은 항 표2
  - 2026년 세제개편안 상세본 p.72
  fact_ko: |-
    중과 한시완화는 '보유기간 2년 이상인 경우에 한정'된다(상세본 p.72, 개조식 p.20). 그리고 현행 소득세법 §104⑦ 후단은
    보유기간 2년 미만인 주택에 대해, 중과세율을 적용해 계산한 산출세액과 §104①2호(주택 2년 미만 60%)·3호(1년 미만 70%)의
    단일세율로 계산한 산출세액 중 큰 세액을 산출세액으로 하도록 정한다. 장기보유특별공제 역시 보유기간 3년 이상인 자산에만 적용되고,
    1세대1주택 표2의 거주기간 공제 첫 구간(2년 이상 3년 미만)도 '보유기간 3년 이상에 한정함'이라는 괄호로 묶여 있다(소득세법
    §95②).
  advice_ko: |-
    취득일(대금청산일 또는 등기부상 접수일)로 보유기간을 먼저 확정하고, 달력에 두 날짜를 함께 찍어라 — 2년이 되는 날(완화 대상 진입,
    단기 60%/70% 탈출)과 3년이 되는 날(장기보유특별공제 진입)이다. 그다음 ① 지금 파는 세액과 ② 각 날짜 이후로 잔금일을 미룬
    세액을 계산해, 미루는 동안 더 내는 보유세를 얹고도 이득인지 본다. 상속받은 주택이라면 보유기간을 피상속인이 취득한 날부터
    기산하므로(소득세법 §104②1호) 상속개시일 기준으로 '2년 미달'이라고 단정하지 말고 피상속인의 취득일부터 다시 세어라.
  caveats_ko:
  - |-
    이 엔진은 아직 2년 미만·1년 미만 단기 보유 세율(60%/70%)을 직접 계산하지 않는다. 보유 2년 미만이면 화면의 세액은 과소평가일
    수 있고, 그 사실이 alternatives_not_taken에 남는다.
  - |-
    2년을 채우려다 2029년으로 넘어가면 중과 완화 구간을 벗어나 오히려 손해일 수 있다. 보유기간 효과와 완화 구간 효과를 합쳐서 계산해야
    한다.
  - 기다리는 동안 보유세가 한 해 더 발생하고(과세기준일 6월 1일) 시세도 변한다. 세금만 보고 잔금을 미루면 안 된다.
  - 계약금·중도금을 이미 받은 상태에서 잔금일을 미루면 매수인과의 계약 변경·위약 문제가 생긴다. 세액 차이보다 계약 리스크가 클 수 있다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    완화의 '보유기간 2년 이상' 요건은 개편안 문서에 각주로 제시돼 있고 조문 문언은 국회 심의에서 확정된다. 기산일 정의에 별도 규정이
    붙을지도 아직 미정이다.
- id: adv.sell_timing.retro_2026_refile
  title_ko: 2026년에 이미 중과로 판 사람도 2027년 신고 때 완화세율을 적용받는다
  severity: opportunity
  when:
    is_one_house: false
    in_regulated_zone: true
    transfer_planned: true
    year_max: 2026
  basis:
  - 소득세법 §104⑦ (2026년 세제개편안 개정안, 특례규정)
  - 2026년 세제개편안 상세본 p.72
  - 2026년 세제개편안 개조식 p.20
  fact_ko: |-
    개편안 상세본 p.72의 <특례규정>은 '중과세율이 적용된 26년 양도분도 27.1.1. 이후 예정·확정신고 시 중과세율 완화(2주택
    +5%p, 3주택 이상 +10%p)를 적용'한다고 밝히고 있고, 여기에도 보유기간 2년 이상 요건이 붙는다. 개조식 p.20 역시 한시완화
    대상에 '26년 중 중과를 적용받은 양도분도 포함'이라고 적었다. 개편안 단계의 내용이며 국회 미통과다.
  advice_ko: |-
    2026년에 조정대상지역 주택을 팔아 +20%p(또는 +30%p)로 예정신고를 마쳤다면 그대로 두지 말고, 개정안이 공포·시행된 것을 확인한
    뒤 2027년 확정신고에서 완화세율로 다시 계산해 정산하라. 준비물은 예정신고서·납부영수증·취득 및 양도 매매계약서, 그리고 보유기간 2년
    이상을 증명할 등기부다. 산출세액이 줄면 개인지방소득세(산출세액의 10%)도 같은 비율로 줄어드니 처음부터 정산 대상에 함께 넣어라.
    확정신고 기한을 이미 넘겼다면 경정청구 경로가 되므로 신고 방식과 기한을 세무대리인에게 먼저 확인하라.
  caveats_ko:
  - |-
    국회에서 개정안이 통과되고 부칙에 이 특례규정이 담겨야 실현된다. 통과 전에 미리 감액해 신고하면 과소신고가 된다 — 법 통과와 시행 시점을
    확인한 뒤 움직여라.
  - 보유기간 2년 미만 양도분은 이 특례 대상이 아니다.
  - 완화되는 것은 세율뿐이다. 2026년 양도분에도 장기보유특별공제 배제는 그대로 적용된다.
  - 이 엔진은 2026년 양도분의 신고 절차·가산세·환급 이자를 계산하지 않는다. 표시되는 금액은 세율 차이만 반영한 값이다.
  reviewed_by:
  - 부부공동명의·세대
  - 거주요건·장특공제
  - 매도시점·중과
  - 편집장
  uncertainty_ko: |-
    국회 미통과. 특례규정의 구체적 문언(이미 낸 예정신고분 처리 방식, 환급 절차와 시기)은 부칙에서 확정되며 현재 공개된 것은 개편안 요약
    표현뿐이다.
