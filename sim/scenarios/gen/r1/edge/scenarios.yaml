label: 기준연도 2030 — 룰셋 범위 밖 · 조정지역 이력 수집 이전 취득
origin: edge
intent: |
  두 가지 "모르는 것"을 동시에 묻는다.
  ① year 2030은 2026.08.03 개편안 룰셋의 사정 범위를 넘는다. 세율·공제를 마지막 연도 값으로
     연장 적용하고 아무 말도 안 하면 조용한 거짓말이다.
  ② 취득일 2019-03-01은 조정대상지역 이력 수집 시작(2025-10-16) 이전이라
     "취득 당시 조정지역이었나"를 알 수 없다. 판정 불가가 정상이다.
  거기에 상속 취득(상속개시일이 취득일보다 늦은 모순)을 얹어 인과 검증까지 건다.
expectation: |
  룰셋 범위 밖 연도는 명시적으로 알려야 한다. 조정지역 여부와 상속 특례는 판정 불가가 옳다.
  상속개시일이 취득일보다 늦은 모순을 그대로 삼키면 검증이 없는 것이다.
