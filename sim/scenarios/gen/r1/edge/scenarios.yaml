id: edge-04
label: 빈값 총동원 — 생년월일·세대·거주이력·전년세액 전부 없음
origin: edge
intent: |
  선택 필드를 한꺼번에 비웠을 때 None 참조로 죽는 자리를 찾는다.
  생년월일 없음(연령공제 판정 불가) · household 없음(세대 판정 불가) ·
  거주 이력 없음 · prior_year_total_tax 없음이 동시에 겹친다.
  households 목록 자체를 두지 않아 "세대가 존재하지 않는 개인"을 만든다.
