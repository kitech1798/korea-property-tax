# 방어 코드를 깨는 것이 목적. 판정 결과와 금액은 쓰지 않는다.

id: edge-01
label: 공시가격 0원 · 1원 — 0으로 나누기와 ±1원 경계
origin: edge
intent: |
  과세표준·공정시장가액비율·비율 계산에서 분모가 0이 되는 경로를 찾는다.
  0원 주택이 "주택 수"에는 잡히는지, 세액 계산에서 0/0이나 NaN이 나오는지가 관심사.
  1원 주택은 반올림·절사(원 단위 절사) 로직이 음수나 예외를 내는지 본다.
expectation: |
  두 트랙 모두 세액이 음수가 되지 않아야 하고, 0원 물건이 있어도 파이프라인이 끊기지 않아야 한다.
  0원/1원 자체로 예외가 나면 방어 코드 결함이다.
tags: [경계, 0원, 극단, 방어코드]
