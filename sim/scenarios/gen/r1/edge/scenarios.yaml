id: edge-09
label: 지분 1/1000 · 세대 밖 공동소유(합 < 1) · 초극단 지분
origin: edge
intent: |
  지분 합이 1에 못 미치는 경우를 엔진이 정규화하지 않고 그대로 쓰는지 본다.
  tiny는 1/1000 초소액 지분(주택 수에는 잡히지만 세액은 미미), over는 부부 1/2씩 + 세대 밖
  제3자 지분은 사건에 적지 않은 경우(합 1), under는 1/4 하나뿐이라 합이 1/4다.

  ★ 원래 이 시나리오는 3인이 1/2씩 가져 합이 3/2인 사건이었다. 그때는 아무 경고 없이
    세액까지 산출됐는데, 그 발견으로 TaxCase가 지분 합 > 1을 거부하게 됐다(2026-08-05).
    이제 그 사건은 **모델 단계에서** 죽으므로 여기서는 유효한 쪽만 남긴다.
    거부 자체는 tests/test_domain.py가 고정한다.
expectation: |
  지분 합 오류는 조용히 정규화하지 말고 드러나야 한다.
  1/1000 지분도 지분율만큼만 과세되어야 하며, 지분이 작다고 세액이 음수가 되면 안 된다.
