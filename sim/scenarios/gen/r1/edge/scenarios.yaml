  기준연도 2026인데 2030년에 취득할 물건을 소유 목록에 넣는다.
  과세기준일에 아직 소유하지 않은 물건이 주택 수와 합산 공시가격에 들어가는지가 핵심이다.
  더해서 2027-06-14 취득 → 2027-06-15 양도로 보유기간 1일짜리 양도를 만든다.
  보유 2년 미만 단기세율 경계이자, 보유연수 0년에서 장기보유특별공제 계산이 죽는지 본다.
