id: edge-03
label: 공시가격이 해마다 하락 (15억→10억→3억→9,000만) + 전년 세액 0원
origin: edge
intent: |
  세부담상한은 "전년 세액 × 상한율"이라 전년 세액이 0이면 상한도 0이 된다.
  상한 0이 당해 세액을 0으로 눌러버리는지, 아니면 상한 적용을 건너뛰는지를 본다.
  동시에 공시가격 하락으로 기본공제 문턱을 위→아래로 통과시켜 구간 전환을 강제한다.
  하락 마지막 해에 부담부증여를 걸어 채무액이 증여가액과 같은 극단(전액 채무)도 함께 친다.
expectation: |
  전년 세액 0을 이유로 당해 세액이 무조건 0이 되면 상한 로직이 틀린 것이다.
  공시가격이 문턱 아래로 내려간 해는 종부세가 사라지고 재산세만 남는 방향이어야 한다.
  부담부증여에서 채무 = 증여가액이면 증여분이 사라지고 전액 유상양도 성격이 되어야 한다.
tags: [하락, 세부담상한, 경계, 부담부증여]
