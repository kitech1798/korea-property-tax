  판정에 필요한 사실이 없으면 그 항목만 판정 불가로 내려가고 나머지 계산은 계속돼야 한다.
  생년월일이 없다고 연령공제를 최대치로 주거나, 세대가 없다고 1세대1주택을 자동 인정하면 결함이다.
