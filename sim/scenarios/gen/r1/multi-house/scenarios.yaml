id: multi-house-02
label: 본인 2채 + 지분 1/1000 한 채 — 주택수 2와 3의 경계
origin: multi-house
intent: |
  소수지분 주택이 주택수에 산입되는지로 세율표가 2주택자와 3주택자로 갈린다.
  지분 1/1000은 과세표준에는 사실상 기여하지 않지만 주택수 카운트는 1이다.
  카운트가 지분으로 안분되어 "0채"가 되면 버그다.
expectation: |
  소수지분이라도 주택수 산입 여부에 따라 세율표가 갈리고, 그 판정이
  결과에 명시적으로 드러나야 한다. 과세표준 기여는 극히 작다.
