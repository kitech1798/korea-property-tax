# 앵글: 다주택 · 조정대상지역 · 법인
# 노리는 것 — 세율표 분기(본인 1~2채 vs 3채 이상), 조정대상지역 중과,
# 공정시장가액비율 분기, 법인 두 종류(단일세율 vs 누진), 주택 외 물건 혼입,
# 그리고 "세대 주택수 ≠ 본인 주택수" 이중 구조.

id: multi-house-01
label: 부부가 각자 2채씩 — 세대 4채, 본인 2채
origin: multi-house
intent: |
  세대 합산이 세율표에 새면 본인이 3주택 이상 세율을 맞는다.
  종부세는 인별 과세이므로 p1은 본인 소유 2채만으로 세율표가 정해져야 한다.
  조정지역 2채를 일부러 p1에게 몰아 넣어, 조정지역 중과가 세대 기준으로
  잘못 발동하는지도 같이 본다.
expectation: |
  p1의 과세표준은 본인 소유 2채 합산으로만 잡히고, 배우자 소유 2채는 들어오지 않는다.
  본인 주택수 2이므로 3주택 이상 중과세율표가 적용되면 안 된다.
