id: multi-house-09
label: 주택 2채 + 종합합산토지 + 별도합산토지 + 일반건축물
origin: multi-house
intent: |
  주택 외 물건이 주택수에 산입되면 본인이 2주택자에서 3주택 이상으로 잘못 넘어간다.
