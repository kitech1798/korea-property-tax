id: special-05
label: 일시적 2주택 처분기한 하루 초과 — 기한 다음 날 양도
origin: special
intent: |
  종전주택(서울)을 두고 2023-06-02 신규주택(하남)을 취득했다.
  종부세 기준일 2026-06-01 시점에 두 채를 모두 보유 중이고,
  양도는 기한을 하루 넘긴 2026-06-02에 이뤄진다.
  일시적 2주택 특례의 기산점이 신규 취득일인지 기준일인지, 처분기한 계산에서
  '3년이 되는 날'을 포함하는지 배제하는지가 하루 차이로 갈린다.
  양도세 트랙도 함께 물어 종부세 판정과 양도세 판정이 서로 다른 기준을 쓰는지 본다.
expectation: |
  기준일에는 두 채를 모두 보유하므로 종부세는 2주택 상태로 계산되되,
  일시적 2주택 특례를 인정하면 1주택 취급이 될 수도 있다. 양도가 기한을 하루
  넘겼으므로 특례 유지 여부가 부정되는 방향이 자연스럽다.
  종부세 판정과 양도세 비과세 판정이 서로 모순된 전제를 쓰지 않아야 한다.
