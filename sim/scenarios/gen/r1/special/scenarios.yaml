id: special-09
label: ★복합 — 한 세대가 상속·일시적2주택·등록임대를 동시에 (부부 분산 보유)
origin: special
intent: |
  특례 세 종류를 한 세대에 겹쳐 놓고, 인별 과세(종부세)와 세대 단위 주택수 판정이
  서로 다른 축으로 움직일 때 특례가 어느 층에서 적용되는지 본다.
  남편 p1: 종전주택(서울) + 신규주택(화성 동탄, 2024-05-30 취득) = 일시적 2주택
  아내 p2: 상속주택 지분 1/3(공시 5.9억, 상속 2023-08-15) + 등록임대 1채
  주체는 p1인데 특례 판정에 필요한 사실은 p2 쪽에 흩어져 있다.
  특례를 모두 빼면 p1은 사실상 1주택, 세대는 여전히 여러 채인 상태가 된다.
expectation: |
  세 특례가 서로를 무효화하지 않아야 한다. 일시적 2주택 판정이 배우자의 상속·임대
  주택 때문에 깨지는지, 아니면 특례주택은 주택수에서 먼저 빠지고 나서 판정하는지가
  핵심이다. 적용 순서가 결과를 바꾸므로 산출물에 순서가 드러나야 한다.
  p1 기준 계산과 세대 기준 판정이 뒤섞여 같은 주택이 두 번 세어지면 안 된다.
tags: [복합, 상속, 일시적2주택, 임대, 부부, 적용순서]
