id: special-04
label: 상속 5년 경과 · 상속 지분과 현재 지분이 어긋남 (상속 후 추가 매수)
origin: special
intent: |
  ① 상속개시일 2021-05-31 → 2026-06-01 기준일에는 5년 하루 초과.
  ② inherited.share는 1/4인데 현재 ownerships.share는 1/2 — 상속 후 다른 상속인
     지분을 사들인 상황. 엔진이 어느 지분으로 40% 요건을 보는지 갈린다.
  ③ 취득일(2019-08-01)이 상속개시일(2021-05-31)보다 앞선다 — 원래 공유자였다가
     추가로 상속받은 모순처럼 보이는 사실. 날짜 정합성 검사가 있으면 여기서 터진다.
  years를 4년 주어 5년 경과 시점이 타임라인 중간에 걸리게 한다.
expectation: |
  2026년에는 이미 5년 요건을 벗어났으므로 상속 특례가 적용되지 않아야 한다.
  더 중요한 것은 지분 기준이다 — 상속 당시 1/4로 보면 40% 이하지만 현재 1/2로 보면
  초과다. 판정 근거에 어느 지분을 썼는지 드러나야 하고, 취득일이 상속일보다 이른
  모순은 오류로 잡히거나 최소한 경고로 드러나야 한다.
