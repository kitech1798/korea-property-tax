id: special-10
label: 특례주택만 보유 — 다 빼고 나면 0채가 되는 세대
origin: special
intent: |
  보유 주택이 상속주택(요건 충족) + 등록임대(요건 충족) 둘뿐이다.
  주택수 제외와 합산배제를 문자 그대로 적용하면 남는 주택이 0채가 된다.
  이때 (a) 세액 0으로 끝내는지 (b) 1주택자로 되돌려 기본공제 12억을 주는지
  (c) 0채인데 1주택 공제를 적용해 음수 과세표준이 나오는지가 갈린다.
  0으로 나누기나 빈 리스트 접근이 있으면 여기서 예외가 난다.
expectation: |
  과세 대상 주택이 남지 않으면 세액은 0이거나, 되돌림 규칙에 따라 한 채가 살아나
  1주택 기준으로 계산되어야 한다. 어느 쪽이든 예외로 죽으면 안 되고,
  "0채인데 12억 공제"처럼 음수 과세표준이 그대로 흘러가면 안 된다.
