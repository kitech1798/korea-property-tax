id: special-06
label: 지방 저가주택 3억 정확 1채 + 3억 1원 1채 — 둘 다 수도권 밖
origin: special
intent: |
  지방 저가주택 요건은 "수도권 밖 + 공시 3억 이하"다. 3억 정확(목포)과
  3억+1원(서귀포)을 나란히 두어 이하 판정의 경계를 직접 대조한다.
  동시에 특례 적용 개수 제한도 건드린다 — 지방 저가주택은 통상 1채만 특례인데
  둘 다 요건을 아슬아슬하게 놓고 어느 쪽을 고르는지, 아니면 둘 다 빼는지 본다.
  서울 본래 주택 1채가 함께 있어 특례가 벗겨지면 3주택 구성이 된다.
expectation: |
  3억 정확은 요건 충족, 3억+1원은 미충족이어야 한다. 결과적으로 특례로 빠지는 것은
  한 채뿐이어야 하며, 산출물에 어느 주택이 왜 제외/미제외인지 각각 드러나야 한다.
  두 채를 모두 빼거나 모두 넣는다면 경계 비교나 개수 제한 중 하나가 죽은 것이다.
