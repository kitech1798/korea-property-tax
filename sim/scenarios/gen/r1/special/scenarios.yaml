# 앵글: 특례주택 복합 (상속 · 일시적2주택 · 지방저가 · 등록임대)
# 노리는 것: 합산배제와 주택수 제외 판정의 경계 ±1원 / ±1일, 그리고 특례가 겹칠 때의 상호작용.
# 판정 결과(주택수·1세대1주택·조정지역)는 쓰지 않는다. 사실만 쓴다.

id: special-01
label: 상속주택 지분 정확히 40% · 공시 6억 정확 · 상속 후 만 5년 되는 해
origin: special
intent: |
  상속주택 주택수 제외 3요건(지분 40% 이하 · 공시 6억 이하 · 5년 이내)을
  셋 다 "정확히 경계값"으로 동시에 맞춘다. 이하/미만을 혼동하면 여기서 갈린다.
  40%를 2/5 분수로 주어 부동소수 반올림으로 40.000001%가 되지 않는지도 본다.
expectation: |
  세 요건 모두 "이하/이내"이므로 경계값은 충족 쪽이어야 한다. 상속주택이 주택수에서
  빠지면 본래 주택 1채만 남는 구성이 되고, 빠지지 않으면 다주택 구성이 된다.
  두 트랙 모두 같은 판정이어야 하며, 판정 근거에 경계 충족이 드러나야 한다.
