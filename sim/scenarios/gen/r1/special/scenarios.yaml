intent: |
  special-01과 단 하나, 지분만 2/5 → 401/1000으로 바꾼다. 나머지 사실은 동일.
  40% 초과 판정이 실제로 작동하는지, 아니면 반올림해서 40%로 봐 주는지 본다.
  분수 문자열이 정확히 유리수로 비교되는지도 함께 검증된다.
