id: special-08
label: 등록임대 5개 유형 전수 보유 — 본래 주택 없이 임대주택만
origin: special
intent: |
  built_public_support / built_long_term / purchased_public_support /
  purchased_long_term / short_term 다섯 유형을 각 1채씩, 유형별 분기를 한 번에 훑는다.
  short_term은 통상 합산배제 대상에서 빠지는 유형이라 다섯 중 하나만 결과가 달라야 한다.
  본래 거주 주택이 없어 "특례를 빼면 0채"가 되는 구성도 겸한다.
  임대의무기간은 2026-06-01 기준으로 하나는 종료 전날, 하나는 종료 당일에 걸린다.
expectation: |
  유형별로 판정이 달라야 한다 — 다섯 채가 전부 같은 취급을 받는다면 type 분기가
  읽히지 않는 것이다. short_term 한 채만 남는 결과가 자연스럽다.
  전부 배제되어 과세 대상이 0채가 되는 경우 세액이 0이 되는지, 아니면
  최소 1채를 되돌려 계산하는지가 드러나야 한다.
