id: special-12
label: 사원용 주택 + 미분양 주택 + 공시가격 0원 지방주택 — 특례 3종의 바깥쪽
origin: special
intent: |
  상속·임대가 아닌 나머지 특례 경로를 한 번에 건다.
  ① company_housing: true 사원용 주택 (개인 명의인데 사원용 표시 — 통상 법인 요건이라
     개인에게 붙었을 때 무시되는지 그대로 빼 주는지가 갈린다)
  ② unsold_new: true 미분양 주택
  ③ 공시가격 0원 주택 — 지방 저가 3억 이하 요건은 형식상 충족하지만 0원은
     평가 미완료를 뜻할 수도 있다. 0으로 나누기·0 분모 비율 계산이 있으면 여기서 터진다.
  본래 주택 한 채는 조정대상지역 고가로 두어 특례가 벗겨졌을 때 세액이 크게 흔들리게 했다.
expectation: |
  공시가격 0원이 정상 값으로 조용히 흘러가면 안 된다 — 0으로 계산하거나
  판정 불가로 표시하거나 둘 중 하나여야 하고, 예외로 죽으면 안 된다.
  사원용·미분양 표시가 개인 보유에도 무조건 적용되면 과소 계산 위험이 있으므로
  적용/미적용 근거가 드러나야 한다.
