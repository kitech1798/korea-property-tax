id: special-07
label: 등록임대 임대료 5% 상한 위반 + 의무기간 이미 종료 · 합산배제 신청은 살아 있음
origin: special
intent: |
  합산배제 요건이 사후에 깨지는 경로를 두 개 동시에 건다.
  ① rent_increase_within_cap: false (임대료 증액 상한 위반)
  ② obligation_end 2025-12-31 — 2026 기준일에는 이미 의무기간 종료
  그런데 elections에는 rental_exclusion 신청이 그대로 남아 있다.
  신청이 있으면 요건 위반을 무시하고 빼 주는지, 요건을 먼저 보는지가 갈린다.
expectation: |
  요건 위반이 신청보다 우선해야 한다 — 상한 위반과 의무기간 종료 어느 쪽이든
  합산배제가 부정되는 방향이 옳다. 신청 존재만으로 배제가 유지된다면
  검증 순서가 뒤집힌 것이다. 두 위반 사유가 각각 근거에 드러나야 한다.
