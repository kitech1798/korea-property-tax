  special-01과 결과가 달라져야 한다. 지분 요건을 넘겼으므로 상속주택이 주택수에
  포함되는 쪽으로 갈리고, 그만큼 세부담이 special-01보다 무거워야 한다.
  두 시나리오가 동일한 결과를 낸다면 지분 경계 비교가 죽어 있는 것이다.
