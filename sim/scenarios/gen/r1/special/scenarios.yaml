id: special-03
label: 상속주택 공시가격 6억 + 1원 · 지분은 넉넉히 통과
origin: special
intent: |
  가액 요건만 딱 1원 넘긴다. 지분(1/5)과 상속경과(2년)는 여유롭게 통과시켜
  탈락 원인이 오직 "6억 초과 1원"임을 고립시킨다.
  가액 판정 기준이 주택 전체 공시가격인지 내 지분 상당액인지도 갈린다 —
  지분 1/5이므로 지분 상당액은 1.2억, 전체는 6억+1원이다. 기준이 다르면 결과가 뒤집힌다.
expectation: |
  6억 "이하"가 요건이므로 1원 초과는 탈락이어야 한다. 다만 판정 기준액이
  전체 공시가격인지 지분 상당액인지에 따라 결론이 정반대가 되므로,
  산출물이 어느 금액을 근거로 삼았는지 명시되어야 한다.
