id: special-11
label: 특례주택에는 살고 본래 주택은 비어 있다 — 거주 판정의 대상이 갈리는 경우
origin: special
intent: |
  본래 주택(서울, 고가)에는 아무도 살지 않고, 상속받은 지방 주택에 실제 거주 중이다.
  1세대1주택 거주 관련 공제는 "과세 대상 주택에 거주"를 전제하는데,
  거주 사실은 주택수에서 빠지는 특례주택 쪽에 붙어 있다.
  거주 이력을 주택별로 보는지 사람별로 보는지에 따라 공제가 붙거나 떨어진다.
  덧붙여 취학 사유(imputed_reason: schooling)로 본래 주택 거주가 중단된 구간을
  하루도 겹치지 않게 붙여 두어, 간주 거주 처리가 이어지는지도 본다.
expectation: |
  거주 공제는 과세 대상이 되는 본래 주택 기준으로 판정되어야 한다.
  특례주택 거주를 본래 주택 거주로 오인해 공제를 주면 과소 계산이다.
  반대로 간주 거주 구간을 무시해 실제 거주 기간이 끊긴 것으로 보면 과대 계산이다.
tags: [거주판정, 상속, 공가, 간주거주, 취학]
