  유불리가 뒤집히는 구간을 정확히 겨눈다. 공시가격을 각자 지분이 1인 공제선을
  딱 1원씩 넘도록 잡았다. 신청하면 늙은 쪽의 큰 세액공제를 쓰지만 공제 한 몫만 받고,
  미신청이면 공제를 두 몫 받는 대신 세액공제를 거의 못 쓴다.
  joint_spouse_election을 비워 엔진이 두 갈래를 직접 비교하게 만든다.
  나이 차가 큰 부부(70세/55세)라 어느 쪽을 지정납세자로 두느냐로 또 갈린다.
