  elections 블록에 모순을 심는다. 지정납세자는 지분 1/10인 배우자인데
  auto_optimize도 true다. 사람이 고른 값과 최적화가 충돌할 때 무엇이 이기는지,
  그리고 지분 큰 사람이 원칙인 규정을 어떻게 처리하는지 본다.
  거주는 지분 큰 쪽만 하고 있어 특례를 누구 이름으로 받느냐가 거주공제를 좌우한다.
