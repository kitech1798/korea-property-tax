# 앵글: 부부 · 세대 · 공동명의
#
# 노리는 것: "인별 과세 + 세대별 판정"의 이중 구조.
# 종부세는 사람마다 매기는데, 1세대1주택인지는 세대로 본다. 시중 계산기는
# 이 둘을 한 덩어리로 뭉개서 부부 각자 1채씩을 "2주택자"로 계산한다.
# 아래 12건은 그 이중 구조가 갈라지는 서로 다른 분기를 하나씩 찌른다.

id: couple-01
label: 부부 각자 단독 1채씩 · 각자 공시가격이 인별 기본공제 경계에서 1원 차이
origin: couple
intent: |
  세대 주택수 2 · 인별 주택수 각 1. 여기에 인별 기본공제 경계를 1원 차이로 걸쳐 둔다.
  남편 집은 9억 + 1원, 아내 집은 9억 − 1원.
  세대를 기준으로 "다주택"이라 판정해 버리면 두 사람 다 과세표준이 생기고,
  인별로 옳게 보면 남편만 1원어치 과세표준이 생긴다. 둘의 차이가 곧 버그 신호다.
expectation: |
  남편(p1)은 경계를 1원 넘겨 과세표준이 0보다 크고, 아내(p2)는 공제 이하라 0이다.
  세대 합산으로 계산했다면 두 사람 모두 큰 과세표준이 잡히므로 즉시 드러난다.
tags: [부부, 세대, 인별과세, 경계1원]
