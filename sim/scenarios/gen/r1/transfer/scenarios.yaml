id: transfer-02
label: 조정지역 취득 1채 · 보유 3년 충족 · 거주 2년에서 하루 모자람
origin: transfer
intent: |
  조정대상지역에서 취득했으므로 비과세에 거주 2년이 추가로 붙는다.
  거주 이력이 2025-11-01 ~ 2027-10-31 = 정확히 2년 -1일.
  비과세 탈락과 동시에 장기보유특별공제가 표2(최대 80%)에서 표1(최대 30%)로 떨어져야 한다.
  두 판정이 같은 "거주 2년"을 공유하는데 한쪽만 떨어지면 로직이 갈라진 것이다.
  취득일이 2025-10-16 이후라 조정지역 이력도 실제로 조회 가능한 구간이다.
expectation: |
  거주 2년을 하루 못 채워 비과세가 불가하고, 장특공제는 표2가 아니라 표1로 산정된다.
  같은 물건을 하루 늦게 팔았다면 결과가 뒤집힌다는 점이 드러나야 한다.
