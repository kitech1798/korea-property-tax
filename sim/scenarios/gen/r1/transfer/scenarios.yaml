id: transfer-12
label: 부담부증여 · 채무가 평가액을 넘고 증여가액에는 못 미침 (안분 분모 어긋남)
origin: transfer
intent: |
  채무 9억 > 평가액 8억인데, 증여가액 10억보다는 작다.
  채무액 > 증여가액은 스키마가 이미 반려하므로(확인 완료), 그 바로 옆칸을 찌른다.
  안분 분모를 증여가액으로 잡으면 비율 0.9로 정상, 평가액으로 잡으면 1.125로 1을 넘는다.
  1을 넘는 순간 증여로 보는 부분이 음수(-1억)가 된다.
  분모를 어느 쪽으로 잡았는지에 따라 결과가 갈리므로, 스키마 검증이 증여가액만 보고
  평가액 경로를 놓쳤다면 여기서 드러난다.
  지분 1/1000이라는 극단값을 함께 물려 안분이 두 번 겹칠 때를 본다.
expectation: |
  채무비율이 1을 넘지 않도록 처리되어 증여로 보는 부분이 음수로 산출되면 안 된다.
  평가액과 증여가액 중 무엇을 분모로 썼는지가 산출 과정에 드러나야 한다.
