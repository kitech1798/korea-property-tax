id: transfer-06
label: 보유 1년 하고 하루 · 60% 구간인데 양도차손 · 필요경비가 양도가액보다 큼
origin: transfer
intent: |
  세 가지 모순을 한 건에 겹쳤다.
  ① 취득 2026-03-01, 양도 2027-03-02 = 1년 +1일 → 60% 단일세율 구간.
  ② 양도가액 5억 < 취득가액 8억 → 양도차손.
  ③ 필요경비 6억이 양도가액 5억보다 크다.
  음수 과세표준에 60% 단일세율을 곱하면 음수 세액이 나올 수 있다.
  0으로 하한을 두는지, 음수를 그대로 뱉는지, 아니면 예외로 죽는지를 본다.
  지분도 1/2이라 안분 후 부호가 어떻게 유지되는지 함께 걸린다.
expectation: |
  양도차익이 음수(양도차손)이므로 납부할 세액이 0 이하로 내려가면 안 된다.
  단일세율 구간이라도 결손에는 세금이 붙지 않는 방향이어야 한다.
