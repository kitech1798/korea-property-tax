intent: |
  개편안 비거주 기본공제 9억을 1원 넘긴다. 과세표준 1원에 공정시장가액비율을 곱하면
  1원 미만이 되는데, 절사하면 0, 반올림하면 1이다. 여기서 세액이 음수나 소수로 새는지 본다.
  현행 12억 기준으로는 여전히 비과세라 두 트랙의 차이가 온전히 개편안 몫이다.
expectation: |
  현행 종부세 0. 개편안은 0이거나 극소액이며 음수·소수점은 나오면 안 된다.
  재산세는 두 트랙 모두 정상 부과된다(종부세만 0인 것이지 재산세가 0인 게 아니다).
