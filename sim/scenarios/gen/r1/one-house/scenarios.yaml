id: one-house-03
label: 비거주 1주택 · 현행 기본공제 12억 - 1원
origin: one-house
intent: |
  두 트랙의 경계가 서로 엇갈리는 지점이다. 현행 12억에는 1원 모자라 과세표준이 0이지만,
  개편안 비거주 9억 기준으로는 약 3억이 과세된다.
  "현행 0 → 개편안 과세"라는 뒤집힘을 엔진이 표현하는지, 그리고 세부담상한이
  전년 세액 0을 어떻게 다루는지(0의 150%는 0인가) 함께 본다.
expectation: |
  현행 트랙은 종부세가 없고, 개편안 트랙은 종부세가 발생한다. 증감률이 0으로 나누기가 되어
  무한대나 오류로 새면 안 된다.
