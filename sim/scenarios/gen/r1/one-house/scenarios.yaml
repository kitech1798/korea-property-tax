id: one-house-07
label: 70세 · 보유 15년에 하루 모자란 해와 채운 해 — 합산 80% 한도
origin: one-house
intent: |
  2011-06-02 취득자는 2026-06-01에 보유 14년 364일(15년 미달), 2027-06-01에 15년을 채운다.
  연령은 1956-05-31생이라 2026년에 이미 만 70세다.
  2026년: 연령 40% + 보유 10년구간 → 합계가 한도에 근접.
  2027년: 연령 40% + 보유 15년구간 → 산술 합계가 80%를 넘어 한도에서 잘려야 한다.
  한도 캡이 없으면 2027년 공제율이 80%를 초과해 나온다.
expectation: |
  두 해 모두 세액공제율 합계가 80%를 넘지 않는다. 2027년 공제율 >= 2026년 공제율.
  개편안 트랙에서 보유공제가 거주공제로 바뀌는 전환과 겹치므로 두 트랙의 공제 구성이 달라도 된다.
