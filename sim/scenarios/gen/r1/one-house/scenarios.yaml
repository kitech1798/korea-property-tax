label: 재건축 — 공사기간 거주 인정과 신축 취득일의 충돌
origin: one-house
intent: |
  종전주택에 2012년부터 살다가 2021-05-01 철거, 2024-08-01 준공으로 다시 취득했다.
  등기상 취득일은 2024년이지만 공사기간은 거주로 인정되고 종전 보유기간은 통산되는 것이
  일반적이다. 엔진이 취득일만 보면 보유 2년짜리로 계산해 고령자 공제가 통째로 날아간다.
  공사기간 39개월이 그대로 인정되는지, 1/2만 인정되는지도 갈림길이다.
expectation: |
  보유·거주 기간이 2024-08-01부터로만 계산되면 재건축 통산이 누락된 것이다.
