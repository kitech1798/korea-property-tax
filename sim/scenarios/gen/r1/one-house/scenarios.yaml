id: one-house-08
label: 보유 20년 · 거주 1년 부부 공동명의 — 4년 전환에서 매년 답이 달라진다
origin: one-house
intent: |
  개편안이 보유공제를 거주공제로 갈아타는 구간(2026 현행유지 / 2027 과도기 / 2028~ 거주)에
  가장 크게 흔들리는 사람은 "오래 보유했지만 최근에야 들어와 산 사람"이다.
  여기에 부부 공동명의 1주택 특례를 겹쳐, 특례를 신청하면 누구의 나이·보유·거주로
  공제를 계산하는지까지 건드린다. 거주는 남편만 2025-01-01부터다.
  네 해가 전부 같은 값으로 나오면 전환 로직이 아예 안 붙은 것이다.
expectation: |
  개편안 트랙에서 2026 → 2029로 갈수록 세액공제 구성이 보유 중심에서 거주 중심으로 이동하며,
  거주 기간이 짧아 후반 연도의 공제율이 떨어질 수 있다. 네 해의 값이 전부 동일하면 의심.
  특례 신청/미신청 비교가 나온다면 유리한 쪽이 선택돼야 한다.
