# 앵글: 1주택 · 고령자 · 거주 (one-house)
#
# 노리는 곳: 기본공제 경계(현행 12억 / 개편안 거주 14억·비거주 9억)의 ±1원,
# 과세기준일(6/1)에 딱 걸린 생일과 보유 만기, 세액공제 합산 80% 한도,
# 개편안의 보유공제→거주공제 4년 전환, 간주거주 사유, 그리고 빈 값·모순.

id: one-house-01
label: 개편안 거주 기본공제 14억에 공시가격이 정확히 일치
origin: one-house
intent: |
  개편안 1세대1주택 거주자 기본공제가 14억이라면, 공시가격 14억 정확히는 과세표준이
  정확히 0이어야 한다. 부등호가 >= 인지 > 인지가 여기서 갈린다.
  연령·보유 세액공제가 개입하지 못하도록 나이는 젊게, 보유는 2년으로 눌러 두었다.
expectation: |
  현행은 12억 공제이므로 과세표준이 남아 세액이 나온다.
  개편안은 과세표준이 0에 닿아 종부세가 사라지거나 최소값이 된다. 음수 과세표준은 나오면 안 된다.
