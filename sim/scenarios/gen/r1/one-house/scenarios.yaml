id: one-house-05
label: 연령 세액공제 60세 진입 — 생일이 과세기준일 6월 1일 당일
origin: one-house
intent: |
  1966-06-01생은 2026-06-01에 만 60세가 되는 날이다. 만 나이는 생일 당일에 오르므로
  60세 구간에 들어가야 맞다. 엔진이 (기준일 - 생일).days // 365 같은 근사로 계산하면
  윤년 누적 때문에 하루가 밀려 공제를 못 받는다.
  보유는 10년을 넘겨 두어 연령공제 유무만 결과를 흔들도록 격리했다.
expectation: |
  과세기준일 당일 생일자는 해당 연령 구간의 공제를 받는다. 연령 세액공제가 0으로
  나오면 만 나이 계산이 하루 밀린 것이다.
