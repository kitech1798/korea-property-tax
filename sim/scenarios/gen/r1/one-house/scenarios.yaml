id: one-house-09
label: 간주거주 사유 5종이 이어 붙고 두 구간이 겹친다
origin: one-house
intent: |
  전근·질병·학교폭력·동거봉양 같은 부득이한 사유로 인정되는 거주를 실제 거주와 이어 붙였다.
  게다가 질병 구간(2020-03-01~2021-08-31)과 동거봉양 구간(2021-01-01~2022-12-31)이
  8개월 겹친다. 겹친 기간을 두 번 세면 거주 기간이 실제보다 부풀어 공제 구간이 한 칸 뛴다.
  간주거주가 개편안의 "거주자 기본공제 14억" 자격까지 만들어 주는지도 함께 본다.
expectation: |
  겹치는 구간은 한 번만 계산돼야 한다. 총 거주 기간이 2016-03-01부터 과세기준일까지의
  달력 기간을 초과하면 중복 합산 버그다.
