id: one-house-12
label: 생년월일도 취득일도 없는데 거주 이력만 있다
origin: one-house
intent: |
  실무 상담에서 흔한 결손 입력이다. 나이를 모르면 연령 공제를 계산할 수 없고,
  취득일을 모르면 보유 기간을 계산할 수 없다.
  엔진이 "모름"을 0세·0년으로 조용히 대체하면 사용자는 틀린 숫자를 정답으로 믿는다.
  게다가 거주 시작(2009-01-01)이 알 수 없는 취득일보다 앞설 수도 있어, 보유보다 거주가
  긴 모순 상태다. 판정 불가가 명시적으로 나오는 것이 옳은 동작이다.
expectation: |
  연령·보유 세액공제는 0으로 단정하지 말고 판정 불가로 표시돼야 한다.
  기본공제와 재산세처럼 나이·취득일과 무관한 부분은 정상 계산될 수 있다.
  예외로 죽거나, 나이를 0세로 가정해 공제 0%를 확정 출력하면 문제다.
