  2027년 과도기 규정이 "보유기간의 1/2 vs 거주기간 중 높은 쪽"이라면,
  보유 20년(→10년)과 거주 14년이 붙었을 때 거주 14년이 채택돼야 한다.
  거주가 이기는 쪽 표본. jb-credit-09가 그 반대 표본이며 둘을 짝으로 읽는다.
  2026(보유 20년)·2027(거주 14년 채택)·2028~(거주 14년)이 서로 다른 구간에
  떨어지도록 숫자를 골랐다.
