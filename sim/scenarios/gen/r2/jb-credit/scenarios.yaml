# 앵글: 종부세 세액공제 — 연령 × 보유/거주 조합
#
# 1회차에서 보유기간이 항상 None이라 아래 분기가 전부 단락됐다. 이제 취득일에서
# 도출되므로, 연령 경계(60/65/70)를 과세기준일 6/1 기준 하루 차이로 때리고,
# 보유 5/10/15년·거주 2/5/10/15년 구간을 교차시키고, 합산 80% 한도와
# 2026 현행 → 2027 과도기 → 2028 이후 전환이 실제로 4년 갈리는지 본다.
#
# 기간은 전부 사실(취득일·거주 이력)에서 도출시킨다. holding_years/residence_years는
# 쓰지 않는다 — 단, jb-credit-07 하나만 일부러 명시해 "명시가 도출을 이기는가"를 본다.

id: jb-credit-01
label: 만 60세가 되는 날이 정확히 과세기준일 6/1 — 15년 보유·15년 거주 1주택
origin: jb-credit
intent: |
  연령 세액공제 하한(60세)을 과세기준일에 정확히 걸친다. 1966-06-01생은
  2026-06-01에 만 60세가 되는 그 날이다. 연령을 "년도 빼기"로 계산하는지
  "과세기준일 시점 만 나이"로 계산하는지가 여기서 갈린다.
  보유·거주는 15년으로 채워 연령 칸만 변수로 남긴다.
expectation: |
  2026년에 연령공제가 붙어야 한다(만 60세 도달일 = 과세기준일).
  2027~2029로 갈수록 연령 구간이 올라가므로 공제율이 단조 증가하거나 최소한
  줄어들지 않아야 한다. 4개 연도가 전부 동일한 값이면 전환 로직이 죽은 것이다.
tags: [종부세, 세액공제, 연령경계, 60세, 1주택]
