  jb-credit-03과 인적 조건은 같고 공시가격만 100억으로 올렸다.
  03과 10의 공제액을 비율로 환산했을 때 같은 비율이면 금액 상한이 없는 것이고,
  10에서 비율이 낮아지면 금액 상한이 작동한 것이다. 어느 쪽인지 관측이 목적이다.
  아울러 극단 금액에서 상한·누진 경계가 깨지지 않는지도 함께 본다.
