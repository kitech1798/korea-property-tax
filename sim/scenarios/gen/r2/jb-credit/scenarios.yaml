id: jb-credit-06
label: 증여받아 계속 살던 집 — 거주 16년인데 보유는 3년 (70세)
origin: jb-credit
intent: |
  부모 집에 2010년부터 계속 살다가 2023년에 증여로 소유권만 넘겨받았다.
  거주기간(16년)이 보유기간(3년)을 크게 앞선다.
  2026 현행(보유 기준)에서는 보유공제 0, 2028 이후(거주 기준)에서는 최고구간이므로
  같은 사람·같은 집에서 연도별로 공제가 크게 뒤집혀야 한다. 여기가 갈리지 않으면
  개편안 전환 자체가 구현되지 않은 것이다.
  또한 거주 시작일이 취득일보다 앞서는 사실 관계를 엔진이 받아들이는지도 본다.
expectation: |
  2026년 공제는 연령분만, 2028·2029년에는 거주분이 더해져 상한 근처까지 올라간다.
  즉 2026 → 2029로 갈수록 공제율이 올라가고 세액 방향이 반대로 움직여야 한다.
  2027 과도기 값은 2026과 2028 사이 어딘가여야지, 2028과 똑같으면 안 된다.
