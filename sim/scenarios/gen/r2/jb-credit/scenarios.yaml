id: jb-credit-03
label: 70세 + 보유 15년 + 거주 15년 — 합산 80% 한도에 정면으로 걸리는 조합
origin: jb-credit
intent: |
  연령 최고구간(70세)과 보유 최고구간(15년)이 동시에 성립한다.
  단순 합산이면 한도를 넘는 조합이므로, 한도가 실제로 잘리는지 본다.
  한도 처리가 없으면 세액이 비정상적으로 낮게(또는 음수 방향으로) 나온다.
  거주도 15년이라 2028년 이후 거주 기준 전환에서도 최고구간을 유지한다.
expectation: |
  합산 공제율이 상한에서 잘려야 한다. 2026·2027·2028·2029 모두 상한에 걸리므로
  같은 공시가격이면 연도 간 공제율은 동일한 상한값이어야 하고,
  세액 차이는 공제율이 아니라 공정시장가액비율·기본공제·세율 변화에서만 와야 한다.
  공제 후 산출세액이 0 미만이거나 공제액이 산출세액을 초과하면 불변식 위반이다.
