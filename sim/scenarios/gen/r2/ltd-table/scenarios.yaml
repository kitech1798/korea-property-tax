  표1 상한(30%)을 훌쩍 넘긴 물건을 조정대상지역 3주택 상태에서 양도시켜
  "긴 보유"와 "중과 배제"가 충돌할 때 어느 쪽이 이기는지 본다.
  중과 한시완화가 살아 있으면 반대로 중과가 빠지고 공제 30%가 붙어야 한다 —
  즉 이 한 건이 완화 시행 여부를 판별하는 리트머스다.
expectation: |
  둘 중 하나로 일관돼야 한다. (a) 중과 적용 → 장특공제 0 + 중과세율,
  (b) 한시완화로 중과 배제 → 장특공제 30% + 기본세율.
  중과세율을 매기면서 장특공제도 30% 태우면 배제 규칙이 안 걸린 것이다.
  취득일(2007년)이 조정지역 이력 수집 시작(2025-10-16)보다 앞서므로
  "취득 당시 조정지역이었나"는 판정 불가가 정상이다 — 양도 시점 판정만 유효하다.
