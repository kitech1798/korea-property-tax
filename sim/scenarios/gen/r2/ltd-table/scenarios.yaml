intent: |
  취득일에서 도출하면 보유 10년(표1 20%)이지만, holding_years에 3을 박아 넣었다.
  명시가 도출을 이기는지, 도출이 명시를 덮는지, 아니면 둘이 섞여 모순 상태로
  계산되는지를 본다. 어느 쪽이든 계약이 문서화돼 있어야 한다.
