# 2회차 · 앵글: 장기보유특별공제 표1·표2
#
# 1회차에서는 취득일이 안 읽혀 보유기간이 None이었고, 장특공제가 전부 0이었다.
# 아래 10건은 그 아래 분기 — 표1 연 2% 계단, 표2 보유4%+거주4%, 개편안 3단계,
# 중과 시 배제 — 를 처음으로 밟게 하는 것이 목적이다.
#
# 보유·거주기간은 원칙적으로 직접 쓰지 않는다. 취득일과 거주 이력만 준다.
# 예외 1건(ltd-table-03)만 holding_years를 일부러 모순되게 명시해
# "명시가 도출을 이기는가"를 관측한다.

id: ltd-table-01
label: 표1 하한 경계 — 보유 3년에서 하루 모자란 양도(비조정 2주택)
origin: ltd-table-agent
intent: |
  표1은 보유 3년부터 6%로 시작한다. 3년에 딱 하루 모자란 보유를 주어
  공제가 0으로 끊기는지 본다. 초일산입/불산입 관례가 어느 쪽인지도 여기서 드러난다.
  조정대상지역이 아닌 곳에 두어 중과가 장특공제를 가리지 않게 격리했다.
expectation: |
  장기보유특별공제가 붙지 않는다(3년 미만). 보유 2년은 넘겼으므로 단기 단일세율이 아니라
  기본세율 구간이어야 한다. 공제 0과 70% 단일세율이 동시에 나오면 1회차 단락의 잔재다.
