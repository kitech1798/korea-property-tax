id: rate-band-10
label: 윤년 2024-02-29 취득 · 2026-02-28 양도 · 조정지역 2주택 · 과표 정확히 8,800만
origin: rate-band-agent
intent: |
  두 가지를 한 번에 밟는다.
  ① 2월 29일 취득의 2년 대응일. 2026년에는 2월 29일이 없다. 대응일을 2/28로 보면
     이 양도는 "2년 이상", 3/1로 보면 "2년 미만"이다. 어느 쪽으로 가는지 관측한다.
  ② §104① 후단의 반대 방향. 과세표준을 8,800만(24% 구간 상단 경계)에 정확히 얹었다.
     2주택 중과 가산이 20%p라면 24+20 = 44%로, 2년 미만 단기세율 60%보다 낮다.
     즉 09와 달리 이번에는 단기세율 쪽이 커야 한다 — 큰 쪽 선택 로직이
     방향에 관계없이 작동하는지 본다.
expectation: |
  보유기간이 2년 이상/미만 중 어느 쪽으로 판정되는지가 세율을 완전히 가른다.
  2년 미만으로 가면 단기 60%와 중과 44%의 경합에서 60%가 이겨야 하고,
  2년 이상으로 가면 누진 24% 구간 + 중과 가산으로 간다.
