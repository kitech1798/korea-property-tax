intent: |
  누진 최상단. 양도차익 10억 250만 − 기본공제 250만 = 과표 10억 정확.
  10억 "초과"부터 45%(누진공제 6,594만)이므로, 정확히 10억이면 42% 구간에
  머물러야 한다. 경계에서 한 칸 위로 새면 누진공제도 함께 틀어져 오차가 커진다.
