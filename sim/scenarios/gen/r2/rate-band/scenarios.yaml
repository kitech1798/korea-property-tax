# 2회차 · 앵글: 양도세 세율 분기 (rate-band)
#
# 1회차에서 취득일이 읽히지 않아 보유기간이 항상 None이었고, 그 아래 트리가 전부
# 단락됐다. 지금은 고쳐졌으므로 "보유기간이 세율을 가르는 지점"이 처음으로 도달 가능하다.
#
# 설계 원칙
#  - holding_years / residence_years 를 쓰지 않는다(단 02는 일부러 명시해 우선순위를 본다).
#    취득일과 양도일만 주고 기간은 엔진이 뽑게 한다.
#  - 03/04/05 와 06/07 은 **날짜만 다르고 나머지가 동일**하다. 세율 점프가 날짜 하나에서
#    나왔다는 것을 대조로 증명하기 위해서다.
#  - 물건은 전부 조정대상지역(서울 강남) + 거주 이력 없음으로 두었다. 1세대1주택 비과세가
#    끼어들어 세율 분기를 가리지 않게 하기 위함이다.
#  - 과세표준을 구간 경계에 정확히 얹었다(장특공제 0인 3년 미만 구간이므로
#    과표 = 양도차익 − 기본공제 250만).

id: rate-band-01
label: 취득한 그날 양도 — 보유기간 0일
origin: rate-band-agent
intent: |
  취득일과 양도일이 같은 날일 때 보유기간이 0일로 나오는지, 아니면 날짜 차이 계산이
  음수/None/1일로 새는지 본다. 1년 미만 단기세율(70%)의 하한 끝점.
expectation: 보유기간은 0(일)이고 1년 미만 단기세율 구간으로 떨어진다. 장기보유특별공제는 없다.
