id: rate-band-09
label: 조정지역 3주택 · 보유 10개월 · 과세표준 정확히 5억 — 70% vs (40%+30%p) 동률 지점
origin: rate-band-agent
intent: |
  소득세법 §104① 후단은 단기세율과 중과세율 중 **큰 쪽**을 적용한다.
  과세표준을 3억 초과 5억 이하 구간(기본 40%)의 상단 경계인 5억에 정확히 얹었다.
  3주택 중과 가산이 30%p라면 40+30 = 70%로 단기세율 70%와 정확히 같아진다 —
  두 경로 중 어느 쪽을 탔든 결과가 같아야 하는 지점이고, 다르게 나오면
  둘 중 한 경로의 계산이 틀린 것이다. 한시 중과배제가 살아 있으면 단기 70%만 남는다.
expectation: |
  1년 미만 보유이므로 단기세율 구간이고, 다주택 중과 판정과 경합한다.
  둘 중 큰 쪽이 선택된 흔적(어느 쪽을 적용했는지)이 결과에 드러나야 한다.
  중과 한시배제가 적용되면 중과 없이 단기세율만 남는 쪽으로 간다.
