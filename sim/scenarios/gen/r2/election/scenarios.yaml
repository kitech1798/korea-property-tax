  지정이 없는 상태에서 엔진이 (a) 명세 오류를 내는지 (b) 임의로 한 명을 고르는지
  (c) 신청 자체를 버리는지 본다. 세 결과 모두 관측 가치가 있다.
  같은 세대에 양도까지 얹어, 고친 취득일 경로도 함께 밟는다.
