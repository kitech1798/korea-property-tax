origin: election-agent
intent: |
  election-01과 사실관계는 동일하고 designated_taxpayer만 p2로 바꿨다.
  p2는 고령·장기거주자다. 지정이 실제로 읽힌다면 연령·보유 세액공제가
  p2 기준으로 산정되어 election-01과 세액이 달라야 한다.
  두 건이 같은 값이면 designated_taxpayer가 무시되고 있다는 뜻이다.
