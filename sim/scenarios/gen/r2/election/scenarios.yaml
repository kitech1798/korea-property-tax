intent: |
  주택 전체 기여는 고령·장기거주자인 p1 쪽인데, 지정납세자를 젊은 p2로 둔다.
  연령·장기보유 세액공제가 "지정납세자 1인 기준"으로 계산된다면 공제가 거의
  사라져야 한다. 반대로 세대 전체나 배우자 사실을 끌어와 공제를 크게 주면,
  공제 귀속 주체가 잘못 잡힌 것이다. 공제 산정 주체를 정확히 조준한 건.
  참고로 p1은 취득·거주가 길고 p2는 혼인으로 뒤늦게 지분을 받았다.
expectation: |
