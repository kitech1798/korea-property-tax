id: election-10
label: "지분 999/1000 대 1/1000 극단 비대칭 + 지정 생략 + 양도기간 명시가 취득일을 이기는가"
origin: election-agent
intent: |
  두 가지를 한 건에 겹친다.
  ① 지분이 999:1로 극단 비대칭인 공동명의에 특례를 신청하면서 지정납세자를 비웠다.
     "공동 소유"의 실질을 지분 하한 없이 그대로 받는지, 미미한 지분을 무시하는지 본다.
  ② transfer에 acquisition_date(2010년)와 모순되는 holding_years: 1을 함께 적었다.
     이번 회차의 수정 지점이 취득일 도출이므로, 명시값과 도출값이 부딪칠 때
     어느 쪽이 이기는지가 관측 대상이다. 명시가 이기면 단기 세율 구간으로,
     도출이 이기면 장기보유 구간으로 갈린다. 둘이 섞이면(세율은 단기, 공제는 장기)
     그게 가장 나쁜 신호다.
expectation: |
  종부세 쪽은 999/1000 지분자와 1/1000 지분자가 공동 소유로 인정되는지에 따라
  결과 형태가 갈린다. 양도 쪽은 보유기간이 한 값으로만 일관되게 쓰여야 하고,
  세율 구간과 장기보유공제가 서로 다른 보유기간을 참조하면 안 된다.
