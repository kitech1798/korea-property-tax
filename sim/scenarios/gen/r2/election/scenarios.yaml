# 2회차 · 앵글: 부부공동명의 특례(joint_spouse_special) — Election이 이제 읽힌다
#
# 1회차에서 사건에 적은 Election을 엔진이 무시했다. 그 경로를 밟는다.
# 판정 결과는 적지 않는다. 보유·거주기간도 (10번을 뺀) 전 건에서 직접 쓰지 않고
# 취득일과 거주 이력만 준다.

id: election-01
label: 부부 반반 공동명의 1주택 · 본인(p1)을 지정납세자로 신청
origin: election-agent
intent: |
  가장 기본형 경로. elections에 joint_spouse_special을 적고 designated_taxpayer를
  subject 본인으로 둔다. 1회차에서는 이 줄이 통째로 무시됐다.
  신청이 읽히면 인별 각자 합산(각 절반)이 아니라 지정납세자 1인에게 주택 전부가
  귀속되어야 한다. 두 계산이 같은 값이면 election이 여전히 안 읽히는 것이다.
expectation: |
  p1 한 사람에게 주택 전체가 귀속된 형태로 과세표준이 잡힌다.
  p2는 이 주택으로 인한 종부세 납세의무를 지지 않는다.
tags: [부부공동명의, 특례신청, 지정납세자, 기본경로]
year: 2026
subject: p1
persons:
  - {id: p1, name: 남편, birth: 1968-05-11, household: h1, spouse: p2}
  - {id: p2, name: 아내, birth: 1971-09-23, household: h1, spouse: p1}
households:
  - {id: h1, members: [p1, p2]}
properties:
  - id: joint
    name: 역삼 아파트
    kind: apartment
    dong: "1168010100"
    urban: true
    area_m2: 84.9
    prices: {2026: 2_000_000_000}
ownerships:
  - {person: p1, property: joint, share: "1/2", acquired: 2014-03-10}
  - {person: p2, property: joint, share: "1/2", acquired: 2014-03-10}
residences:
  - {person: p1, property: joint, start: 2014-03-10}
  - {person: p2, property: joint, start: 2014-03-10}
