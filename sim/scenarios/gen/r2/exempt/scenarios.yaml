# 2회차 · 1세대1주택 비과세 — 보유기간이 처음으로 도출되는 곳
#
# 1회차에는 양도세 엔진이 취득일을 읽지 못해 보유기간이 항상 None이었고,
# 비과세 · 장특공제 · 세율분기가 전부 단락됐다. 그 아래 트리가 이제 처음
# 도달 가능해졌다. 아래 10건은 그 트리의 진입점만 골라 때린다.
#
# 보유·거주기간은 원칙적으로 쓰지 않는다(취득일과 거주 이력만 준다).
# 예외 2건(exempt-02, exempt-08)만 일부러 명시해 "명시가 도출을 이기는가"를 본다.

id: exempt-01
label: 보유 2년 정확히 채운 날 양도 · 비조정 · 12억 이하
origin: exempt-agent
intent: |
  비과세 보유 2년 요건의 하한을 정확히 딛는다. 취득 2024-03-15 → 양도 2026-03-15.
  1회차에는 보유기간이 None이라 이 문이 열린 적이 없다. 취득일에서 보유기간이
  실제로 도출되는지, 그리고 도출된 값이 요건 문턱을 넘기는지 확인한다.
  비조정지역이라 거주 요건은 붙지 않아야 한다.
expectation: |
  보유기간이 취득일에서 도출되어 2년 요건을 충족하고, 양도가액이 12억 이하이므로
  고가주택 안분 없이 양도차익 전액이 비과세된다. 산출세액은 0이어야 한다.
