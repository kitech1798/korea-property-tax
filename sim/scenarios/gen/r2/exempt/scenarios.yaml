id: exempt-08
label: 30억 양도 · 차익 20억 · 보유 3년인데 residence_years만 2로 명시
origin: exempt-agent
intent: |
  안분비율이 커지는 쪽 극단(초과분 18억/30억 = 60%)을 본다. 차익이 20억이라
  안분비율 오차가 세액에 그대로 증폭돼 나타난다.
  동시에 거주 신호를 모순되게 준다 — 실제 거주 이력은 1년인데 residence_years: 2를
  명시했다. 비조정지역이라 비과세 요건에는 거주가 걸리지 않으므로, 이 모순은
  오직 장특공제 표2의 거주 구간에만 영향을 준다. 어느 값이 채택됐는지가 드러난다.
expectation: |
  비과세는 성립하지만 양도가액의 60%가 과세 대상 초과분으로 안분되어 세액이 크다.
  보유 3년 구간의 장특공제는 표2 하단이므로 공제율이 낮게 나와야 한다.
  거주 1년(이력)과 2년(명시) 중 어느 쪽이 공제율에 반영됐는지 추적 가능해야 한다.
