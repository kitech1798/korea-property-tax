  (12억 초과분 1원 ÷ 양도가액)이 사실상 0에 수렴하는 극단을 만든다.
  0으로 나누기·반올림·바닥처리가 어떻게 굴러가는지, 그리고 "고가주택이니까"라며
  차익 전체를 과세하는 실수가 없는지 본다.
