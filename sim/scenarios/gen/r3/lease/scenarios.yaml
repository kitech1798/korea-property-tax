  §155의3①1호 괄호 — "취득으로 임대인의 지위가 승계된 경우의 임대차계약은 제외".
  상생임대 판정에서 가장 흔한 함정이다. 승계 계약을 직전계약으로 세면
  요건을 충족한다고 잘못 안내하게 된다.
