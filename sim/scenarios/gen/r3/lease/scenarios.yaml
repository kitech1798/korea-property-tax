id: lease-01
label: 표준 상생임대 · 직전 24개월 + 상생 24개월 · 4% 인상
origin: lease
intent: |
  손으로 적은 상담 메모의 기본 사건. 취득 당시 조정대상지역, 실거주 0년.
  거주요건을 못 채웠는데 상생임대 특례로 비과세가 서는지 본다.
  이게 안 되면 나머지 시나리오는 전부 의미가 없다.
expectation: |
  상생임대 요건을 모두 갖춰 거주요건이 면제된다. 양도가액이 12억을 넘으므로
  초과분만 과세된다. 장기보유특별공제는 거주 0년이므로 보유공제만 붙는다.
