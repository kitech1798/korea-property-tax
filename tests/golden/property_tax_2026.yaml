unreconciled:
  - id: pt-3house-aggregate
    label: 3주택 · 공시 합계 15억 (동일가액 3채)
    source: {doc: 문답자료, page: 47, row: "별첨 ➂ 시가20억원 수준(공시가 15억) 현행"}
    derivation: "보유세 609.2 − 종부세 126.7 = 482.5"
    status: reproduced_with_inferred_assumption
    inferred_assumption: property_tax_aggregate
    finding: |
      정부 예시는 3주택의 재산세를 물건별이 아니라 **합산 공시가격 한 덩어리**로
      계산했다. 공시 15억을 하나의 물건으로 보면 482.4만원이 나오고(정부 표기 482.5,
      1천원 차이는 반올림), 4개 가액 구간 전부가 이 방식으로 정확히 재현된다.

        공시 15억 → 482.4 (정부 482.5)
        공시 20억 → 668.4 (정부 668.4)
        공시 35억 → 1,226.4 (정부 1,226.4)
        공시 50억 → 1,784.4 (정부 1,784.4)

      그러나 재산세는 지방세법상 **물건별 과세**이고 누진세율도 물건별로 적용된다.
      15억을 3채(각 5억)로 나누면 실제 재산세는 331.2만원이다. 정부 예시는 재산세를
      약 46% 과대계상한 셈이다 — 예시의 초점이 종부세 변화라 재산세를 단순화한 것으로 보인다.

      엔진의 기본값은 **법대로 물건별**로 간다. 정부 예시를 재현하려면 합산 방식을
      명시적으로 선택해야 한다.
    engine_per_property_manwon: 331.2
    government_aggregate_manwon: 482.4
