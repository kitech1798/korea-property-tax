# 재산세 골든 케이스 — 재정경제부 2026 세제개편안 문답자료에서 역산.
#
# 문답자료는 재산세를 단독으로 표기하지 않는다. 대신 "보유세(재산세+종부세)"와
# "종부세 합계"를 둘 다 싣는다. 그 차이가 곧 정부가 계산한 재산세다.
#
#   재산세 = 보유세 − 종부세
#
# 역산값이므로 `derivation`에 산식을 남긴다. 정부가 직접 인쇄한 숫자가 아니라
# 우리가 뺀 값이라는 사실을 숨기면, 나중에 이 테스트가 무엇을 증명하는지 알 수 없게 된다.
#
# 확인된 계산 전제 (5개 케이스가 원 단위까지 일치해 확정)
#   · 1세대1주택 공정시장가액비율 45% (시가표준액 9억 초과 1주택 포함)
#   · 표준세율 적용 — 공시 9억 초과라 1세대1주택 세율 특례(§111의2)는 배제
#   · 도시지역분 0.14% 부과
#   · 지방교육세 = 재산세 본세 × 20% (도시지역분 제외)
#   · 과세표준상한 미적용 (공시가격 변동 없음 가정)

meta:
  source_document: "3. 2026년 세제개편안 문답자료.pdf"
  extracted_to: corpus/reform_2026/문답자료.json
  unit: 만원
  note: |
    문답자료 p.44 사례와 p.46~47 별첨은 모두 "공시가격 변동 없음"을 전제로 하고,
    2027~2028년 재산세를 2026년과 동일한 값으로 표시한다. 즉 1주택 공정시장가액비율
    43~45% 특례(2026년 한정)가 계속 연장된다고 가정한 것이다.

