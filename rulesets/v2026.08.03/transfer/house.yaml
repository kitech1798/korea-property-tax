rule_id: transfer.house_count_specials
unit: spec
description: |
  양도소득세 1세대1주택 판정의 주택 수 특례(소득세법 시행령 §155).

  ★ **종합부동산세의 주택 수 특례와 다른 규정이다.** 섞으면 안 된다.
    2026-08-05 시뮬레이션에서 양도세가 종부령 §4의2③(지방 저가주택) 제외를 그대로
    써서, 2주택자가 1세대1주택자가 되어 양도차익 5.4억이 전액 비과세로 나왔다.
    실측 0원 → 1.7억원. 소득세법에는 지방 저가주택 제외가 없다.

  요건 원문(2026-08-05 법제처 XML 확인, MST 286211 JO=015500)

    §155① 일시적 2주택
      "종전의 주택을 취득한 날부터 **1년 이상**이 지난 후 신규 주택을 취득하고
       신규 주택을 취득한 날부터 **3년 이내**에 종전의 주택을 양도하는 경우"
      ⤷ 양도하는 것이 **종전주택**이어야 한다. 신규주택을 팔면 특례가 아니다.
      ⤷ 종부세의 일시적 2주택(종부령 §4의2①)과 기간·요건이 다르다.

    §155② 상속주택
      "상속받은 주택과 그 밖의 주택(일반주택)을 각각 1개씩 소유하고 있는 1세대가
       **일반주택**을 양도하는 경우에는 1개의 주택을 소유한 것으로 본다"
      ⤷ 단서: "상속인과 피상속인이 상속개시 당시 1세대인 경우에는 … 합치기
        이전부터 보유하고 있었던 주택만 상속받은 주택으로 본다"
      ⤷ 동일세대 여부는 사건에 없다. **엔진은 적용하지 않고 안내만 한다** —
        적용하는 쪽이 세액을 낮추므로, 확인 못 한 채 적용하면 과소신고가 된다.

    §155④ 동거봉양 합가 / §155⑤ 혼인 — "합친 날 / 혼인한 날부터 **10년 이내**
      먼저 양도하는 주택". 합가일·혼인일을 입력받지 않아 안내만 한다.
      ⚠️ 5년이 아니라 10년이다(§155④ 2025.12.30 개정, §155⑤ 2024.11.12 개정).

  ─────────────────────────────────────────────────────────────────────────
  2026 개편안 — 조정대상지역 내 일시적 2주택 처분기한 3년 → 2년

  ⚠️ **정부 원문 2종이 같은 규정을 다르게 적는다.** 둘 다 적어 둔다.

    개조식 p.21
      "※ (양도) '26.8.4. 이후 주택 신규취득하고 시행일('26.10.1.) 이후 종전주택
        양도분부터 적용 / [종전규정 적용] '26.8.3. 이전 취득 또는 매매계약 체결하고
        계약금 지급"

    상세본 p.73 (더 정밀하다)
      "<적용시기> '26.10.1. 이후 조정대상지역 내 종전주택 양도분부터 적용
       <경과조치> '26.8.3. 이전 주택·**주택을 취득할 수 있는 권리**를 취득하거나
        취득하기 위한 매매계약을 체결하고 계약금을 지급한 경우는 종전규정 적용"

    차이 — 상세본은 경과조치 대상에 **분양권·입주권("주택을 취득할 수 있는 권리")**을
    명시한다. 개조식은 "주택"만 적는다. 넓은 쪽(상세본)이 납세자에게 유리하지만,
    이 엔진은 **분양권 취득일을 입력받지 않으므로** 판정하지 않고 드러낸다.

  단축의 요건(상세본 p.73 단서신설)
    "조정대상지역 소재 종전주택을 보유한 상태에서 조정대상지역 소재 신규주택 취득"
    → **두 주택이 모두 조정대상지역**일 때만 2년이다. 하나라도 아니면 3년 그대로다.

  ★ 왜 selector가 아니라 payload인가 — 이 단축은 서로 다른 두 날짜를 동시에 본다.
    ① 양도일이 '26.10.1. 이후인가  ② 신규주택 취득일이 '26.8.4. 이후인가
    블록의 effective_from은 ①(양도일) 하나만 표현할 수 있으므로, ②는 payload에
    값으로 두고 엔진이 대조한다. 코드에 날짜를 박지 않는다는 원칙은 지켜진다.
