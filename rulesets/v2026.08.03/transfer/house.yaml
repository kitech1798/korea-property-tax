rule_id: transfer.sangsaeng_lease
unit: spec
description: |
  상생임대주택에 대한 1세대1주택의 특례(소득세법 시행령 §155의3).

  임대료를 5% 이내로만 올린 집주인에게 **거주요건을 면제**해 주는 제도다.
  실거주하지 않고 세를 준 집도 1세대1주택 비과세(12억)와 장기보유특별공제
  우대(표2)를 받게 해 주므로, 해당 여부가 세액을 통째로 가른다.

  요건 원문(2026-08-13 법제처 XML 확인, MST 286211 JO=015503)

    §155의3① "국내에 1주택(…)을 소유한 1세대가 다음 각 호의 요건을 모두 갖춘
      주택(이하 "상생임대주택"이라 한다)을 양도하는 경우에는 **제154조제1항,
      제155조제20항제1호 및 제159조의4를 적용할 때 해당 규정에 따른 거주기간의
      제한을 받지 않는다**"

      1호 "1세대가 주택을 취득한 후 해당 주택에 대하여 임차인과 체결한 직전
        임대차계약(**해당 주택의 취득으로 임대인의 지위가 승계된 경우의 임대차계약은
        제외**하며, 이하 이 조에서 "직전임대차계약"이라 한다) 대비 임대보증금 또는
        임대료의 증가율이 100분의 5를 초과하지 않는 임대차계약(이하 이 조에서
        "상생임대차계약"이라 한다)을 2021년 12월 20일부터 2026년 12월 31일까지의
        기간 중에 체결(**계약금을 지급받은 사실이 증빙서류에 의해 확인되는 경우로
        한정한다**)하고 임대를 개시할 것"
      2호 "직전임대차계약에 따라 임대한 기간이 1년 6개월 이상일 것"
      3호 "상생임대차계약에 따라 임대한 기간이 2년 이상일 것"

    §155의3③ "직전임대차계약 및 상생임대차계약에 따른 임대기간은 **월력에 따라**
      계산하며, 1개월 미만인 경우에는 1개월로 본다"
    §155의3④ 임차인의 사정으로 임대를 계속할 수 없어 새 계약을 체결한 경우
      재정경제부령 요건을 충족하면 새 계약의 임대기간을 **합산**한다.
    §155의3⑤ 양도세 신고기한까지 특례적용신고서 + 직전임대차계약서 +
      상생임대차계약서를 관할 세무서장에게 제출해야 한다.

  ★★ **면제되는 것은 '거주기간의 제한'이지 거주기간 자체가 아니다.**

    §155의3①이 지목하는 §159의4(장기보유특별공제)는 표2 적용 대상을
    "보유기간 중 **거주기간이 2년 이상**인 것"으로 정의한다(2026-08-13 원문 확인).
    상생임대주택은 이 **진입 요건**을 면제받아 표2로 들어간다.

    그러나 표2 안의 공제율은 소득세법 §95② 표2가 **실제 거주기간**으로 계산한다.
    거주하지 않았으면 거주기간 공제는 0%이고 보유기간 공제만 남는다.
    "2년 거주한 것으로 본다"는 의제 규정은 어디에도 없다.

    이 구분이 2026 개편안에서 치명적이 된다 — 개편안은 보유공제를 거주공제로
    옮기므로(연 4%→2%→폐지), 실거주 0년인 상생임대주택의 장특공제는
    '27년 40% → '28년 20% → '29년 0%로 무너진다. 상생임대 특례가 살아 있어도
    그렇다. **비과세 12억은 지켜지지만 장특공제는 지켜지지 않는다.**

  ⚠️ 아직 판정하지 않는 것
    - 보증금↔월세 전환이 있는 경우의 증가율(§155의3②, 민간임대주택법 §44④ 기준).
      전환식을 확보하지 못했다. 전환이 있으면 판정하지 않고 드러낸다.
    - §155의3④의 합산(재정경제부령 요건 미확보).
    - §155조제20항제1호의 거주요건. 이 엔진의 계산 경로에 없다.
