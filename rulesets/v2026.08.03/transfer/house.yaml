rule_id: transfer.heavy_surcharge
unit: rate
description: |
  다주택자 조정대상지역 주택 양도세 중과(소득세법 §104⑦).

  ★ 개편안이 '27~'28년 한시 완화한다. 종부세를 올리면서 매도 창구를 열어주는 설계다.
    '29년부터 현행 수준으로 복귀하므로, **파는 시점이 세액을 크게 가른다.**
    (보유기간 2년 이상인 경우에 한정)

  중과가 적용되는 기간에는 장기보유특별공제가 배제된다.
