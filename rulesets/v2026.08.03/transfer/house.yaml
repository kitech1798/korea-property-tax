# 양도소득세 (주택).
#
# 보유세만으로는 "팔까 버틸까"의 답이 나오지 않는다. 2026 개편안이
# 종부세를 올리면서 동시에 양도세 중과를 '27~'28 한시 완화한 것도
# **매도 창구를 열어주려는 설계**다. 두 세목을 같이 봐야 판단이 선다.
#
# 값 출처
#   기본세율     법제처 Open API (소득세법 §55, MST 280405) — 법문의 기초금액 형식 그대로
#   개편안       2026년 세제개편안 개조식 p.17·p.20, 문답자료 p.36~38
#
# 계산 구조
#   양도가액 − 취득가액 − 필요경비            = 양도차익
#   × (양도가액 − 12억) / 양도가액             = 과세대상 양도차익 (1세대1주택 고가주택)
#   − 장기보유특별공제(개정안: 장기거주소득공제)  [한도 '28 20억 / '29 10억]
#   − 양도소득 기본공제                        = 과세표준
#   × 기본세율 (+ 다주택 중과)                 = 산출세액
#   + 지방소득세 (산출세액의 10%)              = 총부담

