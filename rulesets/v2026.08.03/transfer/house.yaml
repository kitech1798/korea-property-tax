rule_id: transfer.one_house_exempt_limit
unit: KRW
description: |
  1세대 1주택 비과세 기준금액(소득세법 §89①3, 시행령 §156).
  양도가액 12억원 이하는 전액 비과세, 초과분만 과세한다.

