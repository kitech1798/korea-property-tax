rule_id: transfer.one_house_exempt_requirements
unit: count
description: |
  1세대1주택 비과세의 **보유·거주 요건**(소득세법 시행령 §154①).

  ⚠️ 2026-08-04 감사에서 발견: 엔진이 이 요건을 전혀 보지 않고, 1주택이기만 하면
     양도가액 12억 이하를 전액 비과세로 처리했다. 6개월 보유·1주택·양도차익 3억
     사례에서 **2.29억을 0원으로 안내**했다(단기보유 70% 세율까지 겹친다).

  조문 원문(시행령 §154① 본문. 2026-08-05 법제처 XML 재확인, 축약 없음):
    "1세대가 양도일 현재 국내에 1주택을 보유하고 있는 경우로서 해당 주택의
     보유기간이 2년(제8항제2호에 해당하는 거주자의 주택인 경우는 3년) 이상인 것
     [취득 당시에 「주택법」 제63조의2제1항제1호에 따른 조정대상지역에 있는 주택의
     경우에는 해당 주택의 보유기간이 2년(제8항제2호에 해당하는 거주자의 주택인
     경우는 3년) 이상이고 그 보유기간 중 거주기간이 2년 이상인 것]"

  ⚠️ 예전에는 이 자리에 **축약본을 "원문"이라 적어** 뒀다(2026-08-05 발견).
     "2년" 뒤의 괄호(비거주자 전환 3년)와 조정대상지역의 법적 근거를 조용히
     지웠다. 이 프로젝트가 뉴스 요약을 배격하는 이유가 요약이 원문과 어긋나기
     때문인데, 같은 일을 룰셋 안에서 재생산한 셈이다.
     **원문이라고 적었으면 글자 그대로여야 대조가 성립한다.**

  ★ 거주요건은 **양도 당시**가 아니라 **취득 당시** 조정대상지역 여부로 갈린다.
    그래서 취득일 기준으로 지역을 다시 판정해야 한다.

  ★ 기간 요건 미충족이 곧 결론이 아니다 — §154⑧이 통산을 정한다.
      1호 소실·무너짐·노후로 멸실되어 재건축한 주택 → 멸실 주택의 기간을 통산
      2호 비거주자가 3년 이상 계속 보유·거주 중 거주자로 전환 → 3년 요건
      3호 상속인과 피상속인이 상속개시 당시 동일세대 → 상속 전 기간을 통산
    멸실 주택의 취득일과 피상속인의 보유기간은 아직 입력받지 않으므로 엔진은
    통산을 **지어내지 않고**, 통산 여지가 있으면 판정 불가로 드러낸다.

  단서(§154① 각 호)의 예외 — 보유·거주 제한을 받지 않는 경우 — 는
  수용·해외이주·1년이상 거주 후 부득이한 사유 등 사실관계 확인이 필요하므로
  자동 판정하지 않는다. payload.exceptions_ko로 안내만 한다.
blocks:
  - id: exempt-req-2017
    tracks: [current, reform]
    effective_from: 2017-08-03
    basis: {law: 소득세법 시행령, article: "154", clause: "1", mst: "286211"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=286211&JO=015400", fetched_at: 2026-08-04}
    certainty: enacted
    payload:
      min_holding_years: 2
      min_holding_years_if_nonresident_converted: 3
      min_residence_years_if_regulated_at_acquisition: 2
      period_aggregation_ko:
        - "멸실 후 재건축한 주택 — 멸실 주택의 보유·거주기간을 통산(§154⑧1호)"
        - "비거주자가 3년 이상 계속 보유·거주 중 거주자로 전환(§154⑧2호)"
        - "상속개시 당시 피상속인과 동일세대 — 상속 전 기간을 통산(§154⑧3호)"
      exceptions_ko:
        - "민간·공공건설임대주택 또는 공공매입임대주택을 취득해 양도 + 임차일부터 양도일까지 세대전원 거주 5년 이상(§154①1호)"
        - "공익사업 수용(사업인정 고시일 전 취득분) — 그 양도일 또는 수용일부터 5년 이내 양도하는 잔존주택·부수토지 포함"
        - "해외이주로 세대전원 출국(출국일부터 2년 이내 양도)"
        - "1년 이상 계속 국외거주가 필요한 취학·근무로 세대전원 출국(2년 이내 양도)"
        - "1년 이상 거주한 주택을 취학·근무·질병요양 등 부득이한 사유로 양도"
        - "조정대상지역 공고일 이전 계약·계약금 지급 + 그때 무주택 세대(거주요건만 면제)"

