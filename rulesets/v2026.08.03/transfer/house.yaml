rule_id: transfer.long_term_deduction_cap
unit: KRW
description: |
  장기거주 소득공제 한도 — 개편안 신설(소득세법 §95⑥).
  인별 연간 한도와 양도 물건별 한도를 **각각** 적용한다.
  현행은 한도가 없다. '한도 없음'을 데이터로 남겨야 감사 추적에서 구분된다.
blocks:
