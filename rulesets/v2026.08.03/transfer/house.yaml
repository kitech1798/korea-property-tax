rule_id: transfer.short_term_rate
unit: rate
description: |
  단기보유 주택의 단일세율(소득세법 §104①2·3).

  ★ 이건 기본세율의 '대안'이지 '대체'가 아니다. §104① 후단:
      "하나의 자산이 다음 각 호에 따른 세율 중 **둘 이상에 해당할 때에는**
       해당 세율을 적용하여 계산한 양도소득 산출세액 중 **큰 것**을 그 세액으로 한다"
    §104⑦ 후단도 같다 — 중과 대상 주택이 2년 미만이면
      "중과세율 산출세액과 제1항제2호 또는 제3호의 세율 산출세액 중 **큰 세액**"

  그래서 엔진은 두 산출세액을 **모두 계산해 큰 쪽을 택한다.** 누진공제가 없는
  단일세율이라 과세표준이 작을 때는 기본세율이 이기고, 클 때는 단기세율이 이긴다.

  ⚠️ 조문의 세율은 토지·건물 일반이 40%/50%, **주택·조합원입주권·분양권은 60%/70%**다.
     이 룰셋은 주택만 다루므로 주택 값을 쓴다.
blocks:
  - id: short-under-1y
    tracks: [current, reform]
    effective_from: 2021-06-01
    selector: {holding: "under_1y"}
    basis: {law: 소득세법, article: "104", clause: "1", item: "3", mst: "280405"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=280405&JO=010400", fetched_at: 2026-08-04}
    certainty: enacted
    value: "0.70"
    note: "보유 1년 미만 주택. 조문상 일반자산은 50%, 주택은 70%"

  - id: short-1y-to-2y
    tracks: [current, reform]
    effective_from: 2021-06-01
    selector: {holding: "1y_to_2y"}
    basis: {law: 소득세법, article: "104", clause: "1", item: "2", mst: "280405"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=280405&JO=010400", fetched_at: 2026-08-04}
    certainty: enacted
    value: "0.60"
    note: "보유 1년 이상 2년 미만 주택. 조문상 일반자산은 40%, 주택은 60%"

