rule_id: jongbuse.special.second_home
unit: spec
description: |
  지방 세컨드홈 과세특례 — 인구감소(관심)지역 주택의 주택 수 제외
  (조특법, 소득령·종부령. 개편안 개조식 p.20).

  ★ **엔진이 지역을 판정하지 않는다.** 판정할 데이터가 없기 때문이다.

    · 인구감소지역·인구감소관심지역은 **행정안전부 고시**다. 공공데이터포털
      전체 카탈로그(95,903건)에도 기계가 읽을 형태로 없다 — 조정대상지역과 같다.
    · 개편안이 넓히는 "신규 확대 지역"은 원문이 이렇게 적는다:
        "** 추가되는 구체적인 지역은 **정기 시행령 개정('27.2월)시 규정**"
      즉 **아직 존재하지 않는 목록**이다.

    그래서 가액 기준만 담고 지역 해당 여부는 사용자에게 묻는다.
    없는 목록을 지어내면 이 프로젝트의 존재 이유가 무너진다.

  개정 내용(개조식 p.20 표 원문)
                    현행                          개정안
    대상지역   비수도권(광역시 제외) 소재의     비수도권(광역시 제외) 전 지역
               인구감소지역·인구감소관심지역     — 그 외 지역 신규 확대
    가액기준   인구감소지역 9억(수도권 접경 4억) 인구감소지역 9억(수도권 접경 6억)
    (공시가격) 인구감소관심지역 4억             인구감소관심지역 6억
                                               신규 확대 지역 4억
    적용기한   —                                1주택 특례 3년 연장(~'29.12.31.)

    * 수도권 내 접경지역의 인구감소지역 및 광역시 내 군지역의 인구감소(관심)지역은 포함
blocks:
  - id: second-home-current
    tracks: [current]
    effective_from: 2024-01-01
    basis: {law: 조세특례제한법, article: "71-2"}
    source: {kind: pdf, file: "1. 2026년 세제개편안 개조식.pdf", page: 20}
    certainty: enacted
    payload:
      determined_by_engine: false
      ask_ko: "이 주택이 인구감소지역 또는 인구감소관심지역에 있나요?"
      caps:
        인구감소지역: 900000000
        인구감소지역_수도권접경: 400000000
        인구감소관심지역: 400000000
      note_ko: "비수도권(광역시 제외) 소재여야 합니다. 광역시 내 군지역은 포함됩니다."

  - id: second-home-reform
    tracks: [reform]
    effective_from: 2027-01-01
    basis: {law: 조세특례제한법, article: "71-2"}
    source: {kind: pdf, file: "1. 2026년 세제개편안 개조식.pdf", page: 20}
    certainty: bill_pending
    payload:
      determined_by_engine: false
      ask_ko: "이 주택이 비수도권(광역시 제외)에 있나요? 인구감소(관심)지역인가요?"
      caps:
        인구감소지역: 900000000
        인구감소지역_수도권접경: 600000000
        인구감소관심지역: 600000000
        신규확대지역: 400000000
      applies_until: 2029-12-31
      note_ko: |
        신규 확대 지역의 구체적 범위는 '27.2월 정기 시행령 개정에서 정해집니다 —
        아직 존재하지 않는 목록이라 엔진이 판정할 수 없습니다.
