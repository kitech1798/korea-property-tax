# 종합부동산세 주택 수 특례 · 합산배제.
#
# ★ 두 가지를 구분해야 한다. 섞으면 세액이 통째로 틀린다.
#
#   ① 주택 수 제외 (종부세법 §8④, 시행령 §4의2·§4의3③)
#      1세대1주택자 판정에서만 빼준다. 과세표준에는 **그대로 합산된다**.
#      → 상속주택, 일시적 2주택(신규주택), 지방 저가주택 등
#
#   ② 합산배제 (종부세법 §8②, 시행령 §3)
#      과세표준 합산 자체에서 빠진다. 즉 세금이 안 붙는다.
#      → 등록 임대주택, 사원용 주택, 미분양주택 등
#
# 시중 계산기는 이 판정을 아예 하지 않고 "예외 규정이 있으니 관할 세무서 문의"로
# 회피한다. 그런데 종부세를 실제로 내는 사람 상당수가 이 특례에 걸린다.
#
# 값 출처: 법제처 Open API (종합부동산세법 시행령 MST 283639)
# 원문 확인: python tools/show_law.py 종합부동산세법_시행령 4-2 4-3 3

---
rule_id: jongbuse.special.inheritance
unit: spec
description: |
  상속주택 주택 수 제외(종부령 §4의2②, §4의3③3나).
  세 요건 중 **하나만** 충족하면 주택 수에서 빠진다(누적 조건이 아니다).
blocks:
  - id: inh-current
    tracks: [current, reform]
    effective_from: 2022-01-01
    basis: {law: 종합부동산세법 시행령, article: "4-2", clause: "2", mst: "283639"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=283639&JO=000402", fetched_at: 2026-08-04}
    certainty: enacted
    payload:
      any_of:
        - {key: within_years, years: 5, label: "상속개시일부터 5년이 경과하지 않은 주택"}
        - {key: small_share, max_share: "0.40", label: "지분율이 100분의 40 이하인 주택"}
        - key: low_value
          max_value_capital: 600000000
          max_value_other: 300000000
          label: "지분율에 상당하는 공시가격이 6억원(수도권 밖 3억원) 이하인 주택"
      note: "조합원입주권·분양권을 상속받아 사업시행 완료 후 취득한 신축주택 포함"

