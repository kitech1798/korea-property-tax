rule_id: jongbuse.special.rural_low_price
unit: spec
description: |
  지방 저가주택 특례(종부령 §4의2③). 공시가격 4억원 이하 + 지역 요건을 모두 충족하는
  1주택을 주택 수에서 뺀다.

  개편안(조특법 §71의2)이 대상 지역과 가액 상한을 넓히지만, 그 확대분은 조세특례제한법
  소관이라 이 규칙과 별개다. 여기서는 종부령 본칙만 담는다.
blocks:
  - id: rural-current
    tracks: [current, reform]
    effective_from: 2022-01-01
    basis: {law: 종합부동산세법 시행령, article: "4-2", clause: "3", mst: "283639"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=283639&JO=000402", fetched_at: 2026-08-04}
    certainty: enacted
    payload:
      max_value: 400000000
      all_of:
        - "공시가격이 4억원 이하일 것"
        - "수도권 밖의 광역시·특별자치시가 아닌 지역, 광역시 소속 군, 세종시 읍·면 등에 소재할 것"
      auto_applied_from: 2027-01-01
      auto_applied_note: |
        현행은 관할 세무서장에게 신청해야 특례가 적용된다.
        개편안은 지방 저가주택에 한해 **신청 없이도 적용**하도록 바꾼다(상세본 p.206).

