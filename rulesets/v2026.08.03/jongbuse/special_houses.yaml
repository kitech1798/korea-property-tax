rule_id: jongbuse.special.rental_exclusion
unit: spec
description: |
  합산배제 임대주택(종부세법 §8②, 시행령 §3).

  ★ 위 특례들과 성격이 다르다. 주택 수만 빼주는 게 아니라 **과세표준 합산에서 제외**된다.
    즉 그 주택에는 종부세가 붙지 않는다.

  요건이 임대유형·등록시기·가액·면적·임대료 증액률에 따라 잘게 갈리고, 조정대상지역
  매입임대 아파트는 개편안에서 단계적으로 배제된다. 엔진은 사용자가 제공한 사실만으로
  판정하고, 모자라면 판정하지 않는다.
blocks:
  - id: rental-current
    tracks: [current, reform]
    effective_from: 2021-01-01
    basis: {law: 종합부동산세법, article: "8", clause: "2", mst: "280417"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=280417&JO=000800", fetched_at: 2026-08-04}
    certainty: enacted
    payload:
      requires_registration: true
      requires_rent_cap: true
      rent_increase_cap: "0.05"
      excluded_from_aggregate: true
      undecidable_note: |
        임대유형·등록시기·가액요건·의무임대기간 충족 여부는 등록증과 임대차계약으로만
        확인된다. 엔진은 '요건을 만족한다고 사용자가 확인한 경우'에만 합산배제하고,
        그 사실을 감사 추적에 남긴다.

