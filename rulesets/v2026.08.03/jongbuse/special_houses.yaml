rule_id: jongbuse.special.temporary_two
unit: spec
description: |
  일시적 2주택 특례(종부령 §4의2①). 종전주택을 팔기 전에 신규주택을 취득해
  2주택이 된 경우, 신규주택을 주택 수에서 빼고 1세대1주택자로 본다.

  ★ 개편안이 조정대상지역 간 이동에 한해 3년 → 2년으로 단축한다.
    적용시기: 2026.8.4. 이후 신규 취득분, 2027.6.1. 기준 납세의무 성립분부터.
    경과조치: 2026.8.3. 이전 취득 또는 매매계약 체결·계약금 지급분은 종전 규정.
blocks:
  - id: tmp2-current-3y
    tracks: [current]
    effective_from: 2022-01-01
    basis: {law: 종합부동산세법 시행령, article: "4-2", clause: "1", mst: "283639"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=283639&JO=000402", fetched_at: 2026-08-04}
    certainty: enacted
    payload: {years: 3}

  - id: tmp2-reform-general-3y
    tracks: [reform]
    effective_from: 2027-01-01
    selector: {adjusted_to_adjusted: false}
    basis: {law: 종합부동산세법 시행령, article: "4-2", clause: "1"}
    source: {kind: pdf, file: "1. 2026년 세제개편안 개조식.pdf", page: 21}
    certainty: bill_pending
    payload: {years: 3}
    note: "비조정→조정, 조정→비조정, 비조정→비조정은 현행과 같이 3년"

  - id: tmp2-reform-adjusted-2y
    tracks: [reform]
    effective_from: 2027-01-01
    selector: {adjusted_to_adjusted: true}
    basis: {law: 종합부동산세법 시행령, article: "4-2", clause: "1"}
    source: {kind: pdf, file: "1. 2026년 세제개편안 개조식.pdf", page: 21}
    certainty: bill_pending
    payload:
      years: 2
      grandfather_before: 2026-08-04
    note: "조정대상지역 주택 보유 상태에서 조정대상지역 신규 취득 시 2년으로 단축"

