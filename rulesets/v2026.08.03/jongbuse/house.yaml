rule_id: jongbuse.house.taxable_threshold
unit: KRW
description: |
  주택분 종부세 **과세대상 문턱**(종부세법 §7① 개정안).

  ⚠️ 2026-08-04 감사에서 발견: 개편안이 과세대상 문턱과 기본공제를 **분리**하는데
     룰셋에는 기본공제만 있었다. 비거주 1주택 공시 12억이면 문턱(14억) 미달이라
     과세대상이 아닌데, 엔진은 기본공제 9억을 빼고 90.8만원을 매겼다.

  개조식 p.20이 둘을 별개 항목으로 적는다:
    □ 주택분 종합부동산세 **과세대상 조정**
      ㅇ (1세대1주택자) 공시가격 14억원 초과시 종부세 부과
      ㅇ (그 외) 공시가격 합계액 9억원 초과시 부과(현행유지)
    □ 주택분 종합부동산세 **기본공제금액 조정**
      ㅇ 거주 1주택 14억 / 비거주 1주택 9억 / 그 외 4억 + 5억 × 거주비중

  ★ 그래서 **비거주 1주택자의 9억~14억 구간**과 **다주택자의 기본공제~9억 구간**에서
    문턱과 기본공제가 어긋난다. 거주 1주택자는 둘 다 14억이라 우연히 일치한다.

  현행법은 기본공제가 곧 문턱이라 별도 규칙이 필요 없다 — current 트랙에는
  블록을 두지 않고, 엔진이 규칙 없음을 '문턱 없음'으로 읽는다.

  ⚠️ 문턱 기준액이 인별인지 세대인지, 지분 반영 전후인지는 원문에 없다.
     §7①이 납세의무자 규정이므로 인별 해석을 기본으로 두되 decree_pending으로
     낮춰 둔다. 기본공제 신공식과 같은 성격의 미정의 영역이다.
blocks:
  - id: threshold-reform-one-house
    tracks: [reform]
    effective_from: 2027-01-01
    selector: {taxpayer: individual, one_house: true}
    basis: {law: 종합부동산세법, article: "7", clause: "1"}
    source: {kind: pdf, file: "1. 2026년 세제개편안 개조식.pdf", page: 20}
    certainty: bill_pending
    value: 1400000000
    note: "개조식 p.20 · 문답 p.43. 시가 약 20억 수준"

  - id: threshold-reform-other
    tracks: [reform]
    effective_from: 2027-01-01
    selector: {taxpayer: individual, one_house: false}
    basis: {law: 종합부동산세법, article: "7", clause: "1"}
    source: {kind: pdf, file: "1. 2026년 세제개편안 개조식.pdf", page: 20}
    certainty: bill_pending
    value: 900000000
    note: |
      "(그 외) … 9억원 초과시 부과(현행유지)". 금액은 현행과 같지만,
      개편안에서 기본공제가 4억까지 내려가므로 **문턱과 기본공제가 처음으로 갈린다.**

  - id: threshold-reform-corporation
    tracks: [reform]
    effective_from: 2027-01-01
    selector: {taxpayer: corporation}
    basis: {law: 종합부동산세법, article: "7", clause: "1"}
    source: {kind: pdf, file: "2. 2026년 세제개편안 상세본.pdf", page: 61}
    certainty: bill_pending
    value: 0
    payload: {applicable: false}
    note: "법인은 기본공제도 문턱도 없다(현행 유지)"

