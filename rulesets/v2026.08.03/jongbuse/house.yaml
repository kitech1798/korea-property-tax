# 종합부동산세 주택분.
#
# 현행법(current)과 2026.8.3 개편안(reform) 두 트랙을 함께 담는다.
# 개편안은 국회 미통과이므로 certainty를 bill_pending으로 표시하고, 화면에는
# "국회 미통과" 배지가 뜬다. 두 트랙을 나란히 보여주지 않는 것 자체가 오류다.
#
# 현행법 값 출처: 법제처 Open API (종합부동산세법 MST 280417, 시행령 MST 283639)
# 개편안 값 출처: 2026년 세제개편안 개조식 p.18~19 (corpus/reform_2026/개조식.md)
#
# ⚠ YAML: 연도 약칭(’27)을 따옴표 없이 쓰면 인용부호로 파싱된다. 문자열은 큰따옴표로.

