rule_id: jongbuse.house.property_tax_credit_method
unit: rate
description: |
  주택분 종부세에서 공제되는 재산세액(종부세법 §9③, 시행령 §4의3①).

  ★ 이 산식의 해석이 종부세 재현의 관건이었다.

    공제할 재산세액 = 부과된 재산세 세액 합계 × ─────────────────────────────
                    (종부세 과세표준 × 재산세 공정시장가액비율) × 재산세 표준세율
                    ─────────────────────────────────────────────
                    주택을 합산하여 재산세 표준세율로 계산한 재산세 상당액

  분자의 "재산세 표준세율"을 **누진 전체가 아니라 해당 구간의 한계세율**로 적용해야
  정부 문답자료 p.44의 세 값(세액공제 516.5 / 종부세 154.9 / 468.9만원)이 동시에
  원 단위까지 재현된다. 누진 전체로 적용하면 어느 값도 맞지 않는다.
  정부가 공개하지 않은 부분이라 근거는 재현 결과이며, 확정도를 assumed로 둔다.
blocks:
  - id: ptc-marginal-rate
    tracks: [current, reform]
    effective_from: 2009-01-01
    basis: {law: 종합부동산세법 시행령, article: "4-3", clause: "1", mst: "283639"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=283639&JO=000403", fetched_at: 2026-08-04}
    certainty: assumed
    payload:
      numerator_rate: marginal
      note: "문답자료 p.44 3개 값 동시 재현으로 확인. tests/golden/jongbuse_2026.yaml 참조"

