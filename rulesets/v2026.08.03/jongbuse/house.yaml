rule_id: jongbuse.house.basic_deduction
unit: KRW
description: |
  주택분 기본공제(종부세법 §8①).

  개편안의 핵심 전환이 여기 있다. 현행은 '1세대1주택이냐'만 보지만,
  개편안은 '거기 사느냐'를 함께 본다 — 같은 사람·같은 집인데 거주 여부로 5억이 갈린다.

  ★ 다주택 신공식 `4억 + 5억 × (거주주택 공시가격 ÷ 주택 공시가격 합계액)`은
    미정의 영역이 많다. 거주주택이 2채인 세대는? 분자·분모는 지분 반영 전인가 후인가?
    합계액은 인별인가 세대인가? 시행령 없이는 답이 없는데 이 한 줄이 공제 4억~9억을 가른다.
    variant로 해석을 분리하고 확정도를 decree_pending으로 낮춰 둔다.
