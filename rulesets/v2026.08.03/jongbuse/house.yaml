    basis: {law: 종합부동산세법, article: "8", clause: "1"}
    source: {kind: pdf, file: "1. 2026년 세제개편안 개조식.pdf", page: 18}
    certainty: bill_pending
    value: 900000000
    note: "비거주 1주택 12억 → 9억. 거주 여부만으로 5억 차이가 난다"

  - id: bd-reform-multi
    tracks: [reform]
    effective_from: 2027-01-01
    selector: {taxpayer: individual, one_house: false}
    basis: {law: 종합부동산세법, article: "8", clause: "1"}
    source: {kind: pdf, file: "1. 2026년 세제개편안 개조식.pdf", page: 18}
    certainty: decree_pending
    payload:
      formula: base_plus_residence_share
      base: 400000000
      residence_bonus: 500000000
      variant: household_published_price
      variants_considered:
        - household_published_price: "분모 = 세대 전체 주택 공시가격 합계 (기본값)"
        - person_published_price: "분모 = 인별 합산 공시가격"
        - share_adjusted: "분자·분모 모두 지분 반영 후 금액"
    note: |
      4억 + (5억 × 거주용주택 공시가격 ÷ 주택 공시가격 합계액).
      개조식 p.18 원문. 문답자료 p.40의 적용사례(2주택 각 10억 중 1채 거주 → 6.5억,
      3주택 각 10억 중 1채 거주 → 약 5.7억)와 일치하는 해석을 기본값으로 둔다.
      세부 산정방법은 시행령 위임이므로 decree_pending.

