# 배우자 증여 — **절세 전략의 비용을 계산하기 위한 최소 집합**.
#
# 이 서비스는 증여세를 계산하는 서비스가 아니다. 그런데 "부부간에 지분을 나누면
# 종부세가 줄어든다"는 조언을 하려면 **그 대가**를 같이 계산해야 한다.
# 절감액만 크게 써 놓고 증여세·취득세를 빼면 그건 조언이 아니라 유인이다.
#
# 그래서 범위를 **배우자 증여 한 가지로** 못 박는다. 직계존비속 증여, 상속,
# 저가양수 등은 담지 않는다. 담을 수 있는 척하면 쓰는 사람이 그걸 믿는다.
#
# 값 출처 — 전부 2026-08-05 법제처 Open API(type=XML) 원문 확인.
#   상증세법 MST 276123 (시행 2026-01-02) §53 §56 §69
#   지방세법 MST 282559 (시행 2026-07-01) §6 §11 §13의2

---
rule_id: gift.spouse.deduction
unit: KRW
description: |
  배우자 증여재산 공제(상증세법 §53①1호).

  조문 원문:
    "거주자가 다음 각 호의 어느 하나에 해당하는 사람으로부터 증여를 받은 경우에는
     다음 각 호의 구분에 따른 금액을 증여세 과세가액에서 공제한다. 이 경우 그
     증여세 과세가액에서 공제받을 금액과 수증자가 그 증여를 받기 **전 10년 이내에
     공제받은 금액**을 합한 금액이 … 초과하는 경우에는 그 초과하는 부분은 공제하지
     아니한다.
       1. 배우자로부터 증여를 받은 경우: **6억원**"

  ⚠️ **10년 합산이다.** 이미 배우자에게 증여한 이력이 있으면 그만큼 줄어든다.
     엔진은 과거 증여 이력을 입력받지 않으므로 6억을 그대로 쓰되, 화면이 이 사실을
     반드시 밝힌다. 모르는 것을 유리하게 가정하는 자리가 여기다.
