rule_id: gift.rate_table
unit: rate
description: |
  증여세 세율. **상증세법 §56이 §26(상속세 세율)을 그대로 준용한다.**

    §56 "증여세는 제55조에 따른 과세표준에 **제26조에 규정된 세율**을 적용하여
         계산한 금액으로 한다"

  법문이 "기초금액 + 초과금액의 세율" 형식이라 base_amount를 그대로 옮긴다.
  화면 대입식이 조문과 글자 그대로 같아야 사용자가 검산할 수 있다.

  ⚠️ 법제처 API는 이 표를 **이미지로** 준다(JSON·HTML). XML로 받아야 텍스트가 나온다.
