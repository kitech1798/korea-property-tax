unit: rate
description: |
  신고세액공제(상증세법 §69②).

    "증여세 과세표준을 신고한 경우에는 증여세산출세액 … 의 **100분의 3**에
     상당하는 금액을 공제한다"

  기한 내 신고가 전제다. 증여일이 속하는 달의 말일부터 3개월 이내(§68①).
