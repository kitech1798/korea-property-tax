rule_id: gift.acquisition_tax
unit: rate
description: |
  증여(무상취득) 취득세율.

    지방세법 §11①2 "제1호 외의 **무상취득: 1천분의 35**"

  ★ 조정대상지역 중과 — §13의2②
    "조정대상지역에 있는 주택으로서 대통령령으로 정하는 **일정가액 이상**의 주택을
     … 무상취득을 원인으로 취득하는 경우에는 … 같은 항 제7호나목의 세율(1천분의 40)을
     표준세율로 하여 해당 세율에 **중과기준세율의 100분의 400**을 합한 세율을 적용한다"

    중과기준세율 = 1천분의 20 (§6 19호)
    → 4% + (2% × 4) = **12%**

  ⚠️ '일정가액'은 시행령 소관이고 이 룰셋은 그 시행령 조문을 아직 확인하지 않았다.
     그래서 중과 여부를 **자동 판정하지 않고** 두 값을 모두 보여준다.
     확인 못 한 것을 확인한 척하지 않는다.

  ⚠️ 지방교육세·농어촌특별세가 별도로 붙는다. 이 룰셋은 취득세 본세만 담는다.
