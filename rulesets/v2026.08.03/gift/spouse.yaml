rule_id: gift.spouse_carryover_years
unit: count
description: |
  ★ **이 전략의 가장 큰 함정** — 이월과세(소득세법 §97의2①).

    "거주자가 양도일부터 소급하여 **10년** 이내에 그 배우자 … 로부터 증여받은
     자산의 양도차익을 계산할 때 양도가액에서 공제할 필요경비는 … 다음 기준을 적용한다.
       1. **취득가액은** 거주자의 배우자 … 가 해당 자산을 **취득할 당시의 금액**으로 한다.
       3. 거주자가 해당 자산에 대하여 납부하였거나 납부할 **증여세 상당액**이 있는
          경우 필요경비에 산입한다."

  즉 배우자에게 증여한 뒤 10년 안에 팔면 취득가액이 **증여 당시 시가가 아니라
  원래 취득가**로 돌아간다. 증여로 취득가액을 높여 양도세를 줄이려는 시도가
  봉쇄되고, 오히려 증여세·취득세만 낸 꼴이 될 수 있다.

  ⚠️ 2023.12.31 개정으로 5년 → **10년**으로 늘었다. 기억으로 5년이라 쓰면 틀린다.

  종부세 절감 목적의 증여라도 이 기간 안에 매도 계획이 있으면 손익이 뒤집힌다.
  그래서 전략을 제시할 때 **반드시 함께 말한다.**
