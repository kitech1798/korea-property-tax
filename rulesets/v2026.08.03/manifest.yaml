version: v2026.08.03
description: |
  2026.8.3 재정경제부 세제개편안 발표 시점의 룰셋.
  현행법(current)과 개편안(reform) 두 트랙을 함께 담는다.

  개편안은 아직 국회를 통과하지 않았다. 그러므로 "얼마 나오나요"의 정답은
  하나가 아니라 둘이고, 둘을 나란히 보여주지 않는 것 자체가 오류다.

as_of: 2026-08-04

sources:
  - kind: law_api
    name: 국가법령정보 공동활용 Open API
    url: https://open.law.go.kr
    note: 조문 스냅샷은 corpus/law_snapshots/ 에 있다. tools/fetch_law.py로 갱신.
  - kind: pdf
    name: 2026년 세제개편안 (재정경제부, 2026.8.3 발표)
    note: |
      원문 PDF는 세제개편안_8.3/ 에, 페이지별 텍스트는 corpus/reform_2026/ 에 있다.
      뉴스·해설 등 2차 출처는 근거로 쓰지 않는다 — 조사 중 전문지 요약조차
      원문과 어긋나는 사례를 확인했다(장기보유특별공제 단계 시행을 1단계로 축약).

covered:
  - 재산세 주택분 (지방세법) — 현행법만. 이번 개편안에 재산세 개정 항목은 없다.
  - 종합부동산세 주택분 (종합부동산세법) — 현행 + 개편안

not_covered:
  - 양도소득세 · 취득세 · 상속증여세
  - 토지분 재산세 · 종부세
  - 조정대상지역 고시 이력 (reference/regulated_areas.yaml에 별도 관리, 공공데이터 없음)
