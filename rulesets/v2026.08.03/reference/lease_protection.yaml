# 주택임대차보호법 — 세법이 아니지만 **세법보다 먼저 오는 기한**.
#
# 왜 세금 룰셋에 임대차법이 들어오는가
#   매도 시점을 고를 때 구속력이 가장 큰 기한이 세법에서 나오지 않는 사건이 있다.
#   상생임대주택 특례의 양도기한이 2028-01-31이어도, 그 집에 세입자가 있으면
#   **2026-11-30까지 갱신거절을 통지하지 않는 한** 임대차가 2년 더 붙는다.
#   세법만 보면 "2028년 1월까지 팔면 됩니다"라고 답하게 되는데, 그때는 이미
#   1년 2개월 전에 손쓸 시점이 지나 있다.
#
#   그래서 이 파일은 세액을 계산하지 않는다. **언제까지 무엇을 해야 하는가**를 낸다.
#
# 출처: 국가법령정보 Open API, 주택임대차보호법 MST 276291 (2026-08-13 XML 확인)
#       시행 2026-01-02 / 공포 2025-10-01
#
# ⚠️ 시행일에 대하여
#   갱신거절 통지기간을 1개월 → **2개월** 전으로 바꾼 것은 <개정 2020.6.9>이고,
#   그 시행일은 **부칙**에 있다. 이 프로젝트의 법제처 수집 경로는 부칙을 어떤
#   형식으로도 받지 못한다(docs/미구현_목록.md A절에 기록된 구조적 공백).
#   조문 본문으로 확인할 수 있는 것은 개정일뿐이므로 effective_from을 공포일로
#   두고, 그 한계를 여기 적는다. 현재 유효한 임대차는 모두 이 개정 이후이므로
#   실무상 답이 갈리지 않는다 — 답이 갈리지 않는 곳에서 판정 불가를 내지 않는다.

---
rule_id: reference.lease_renewal_notice
unit: spec
description: |
  임대차 갱신에 관한 기한(주택임대차보호법 §6·§6의2·§6의3).

  원문(2026-08-13 법제처 XML, 축약 없음)

    §6① "임대인이 임대차기간이 끝나기 **6개월 전부터 2개월 전까지의 기간에**
      임차인에게 갱신거절(更新拒絶)의 통지를 하지 아니하거나 계약조건을 변경하지
      아니하면 갱신하지 아니한다는 뜻의 통지를 하지 아니한 경우에는 그 기간이
      끝난 때에 전 임대차와 동일한 조건으로 다시 임대차한 것으로 본다.
      임차인이 임대차기간이 끝나기 2개월 전까지 통지하지 아니한 경우에도 또한
      같다. <개정 2020.6.9>"
    §6② "제1항의 경우 임대차의 존속기간은 **2년으로 본다**"
    §6③ "2기(期)의 차임액에 달하도록 연체하거나 그 밖에 임차인으로서의 의무를
      현저히 위반한 임차인에 대하여는 제1항을 적용하지 아니한다"

    §6의3① "제6조에도 불구하고 임대인은 임차인이 **제6조제1항 전단의 기간 이내에**
      계약갱신을 요구할 경우 정당한 사유 없이 거절하지 못한다. 다만, 다음 각 호의
      어느 하나에 해당하는 경우에는 그러하지 아니하다."
      8호 "임대인(임대인의 직계존속ㆍ직계비속을 포함한다)이 목적 주택에 실제
        거주하려는 경우"
    §6의3② "임차인은 제1항에 따른 계약갱신요구권을 **1회에 한하여** 행사할 수
      있다. 이 경우 갱신되는 임대차의 존속기간은 **2년으로 본다**"

  ★ 임대인의 통지 기간과 임차인의 갱신요구 기간이 **같다**(§6의3①이 §6①전단을
    그대로 인용한다). 즉 6개월 전~2개월 전은 양쪽이 동시에 쓰는 창구다.
    임대인이 먼저 통지해도 임차인이 요구권을 행사하면 §6의3①이 §6에 우선한다
    ("제6조에도 불구하고"). **통지만으로는 막지 못한다.**

  ⚠️ 이 룰셋이 판정하지 않는 것
    §6의3① 단서 1~9호의 거절 사유는 전부 사실관계다(연체·부정임차·합의·파손·
    멸실·철거·실거주·의무위반). 특히 8호(실거주)는 거절 후 제3자에게 임대하면
    §6의3⑤·⑥의 손해배상이 따르므로, 엔진이 "거절할 수 있습니다"라고 말해서는
    안 된다. 사유의 **존재를 알리고** 확인을 요구한다.
blocks:
  - id: lease-renewal-2020
    tracks: [current, reform]
    effective_from: 2020-06-09
    basis: {law: 주택임대차보호법, article: "6", clause: "1", mst: "276291"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=276291&JO=000600&type=XML", fetched_at: 2026-08-13}
    certainty: enacted
    payload:
      notice_window_months_before: {earliest: 6, latest: 2}
      implied_renewal_years: 2
      tenant_renewal_right_times: 1
      tenant_renewal_right_years: 2
      landlord_refusal_grounds_ko:
        - "2기의 차임액에 이르도록 차임을 연체한 사실이 있는 경우(§6의3①1호)"
        - "거짓이나 그 밖의 부정한 방법으로 임차한 경우(2호)"
        - "합의하여 상당한 보상을 제공한 경우(3호)"
        - "임대인 동의 없이 전대한 경우(4호)"
        - "고의·중과실로 파손한 경우(5호)"
        - "멸실되어 임대차의 목적을 달성하지 못할 경우(6호)"
        - "철거·재건축을 위해 점유 회복이 필요한 경우(7호 가~다목)"
        - "임대인(직계존속·직계비속 포함)이 목적 주택에 실제 거주하려는 경우(8호)"
        - "그 밖에 의무를 현저히 위반하거나 임대차를 계속하기 어려운 중대한 사유(9호)"
      refusal_damages_ko: |
        8호(실거주)로 거절한 뒤 갱신되었을 기간이 만료되기 전에 정당한 사유 없이
        제3자에게 임대하면 손해를 배상해야 한다(§6의3⑤). 배상액은 환산월차임
        3개월분 / 제3자 임대 차액의 2년분 / 실손해액 중 **큰 금액**이다(§6의3⑥).
      note_ko: |
        임대인의 갱신거절 통지 기간과 임차인의 갱신요구 기간이 같다.
        통지했더라도 임차인이 요구권을 행사하면 §6의3①이 우선하므로,
        요구권이 남아 있는지를 먼저 확인해야 한다.
