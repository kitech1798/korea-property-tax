# 조정대상지역 · 투기과열지구 지정 현황.
#
# ★ 이 파일이 존재하는 이유
#   공공데이터포털 전체 카탈로그(95,903건)를 전수 검색해도 조정대상지역 데이터는
#   **0건**이다. 브이월드에도 없다(토지이용규제 기본법상 지역·지구가 아니라
#   공간레이어로 존재하지 않는다). 즉 기계가 읽을 공식 소스가 없다.
#   그래서 국토교통부 공고를 사람이 옮겨 적는 수동 테이블이 유일한 정답이다.
#
#   시중 계산기가 `주소.startswith("서울")`로 때운 것도 이 때문이다. 데이터가 없으니
#   추측한 것이다. 우리는 추측하는 대신 **모르면 모른다고 말한다**.
#
# ★ 부패 위험이 가장 높은 데이터
#   주택법 §63의2⑦·§63⑥은 국토부장관에게 **반기마다** 재검토 의무를 지운다.
#   실제로는 수시로 바뀐다(2025.10 대규모 확대, 2026.7 추가). 그래서 블록마다
#   effective_from을 박고, 기준일이 마지막 확인 시점을 넘으면 엔진이 확실성을 낮춘다.
#
# ★ 교차검증 소스 (주 1회 diff 권장)
#   한국부동산원 청약홈 규제지역정보 — 서버 렌더 HTML이라 파싱 가능
#   https://www.applyhome.co.kr/ai/aic/selectSpecltSubscrptRndAreaList.do
#   2026-08-04 파싱 결과가 국토부 공고와 100% 일치함을 확인했다.
#
# ★ 지정 단위
#   주택법 §63의2① 후단은 "시·군·구 또는 읍·면·동의 지역 단위"로 지정할 수 있다고
#   정한다. 현행 40곳은 전부 시·군·구(일반구 포함) 단위여서 법정동코드 앞 5자리로
#   판정할 수 있다. 다만 읍면동 단위 지정이 나오면 10자리로 확장해야 한다.
#
# ★ 2026-08-04 현재 조정대상지역과 투기과열지구는 **완전히 같은 40곳**이다.
#   두 목록을 따로 관리하되 값은 동일하게 둔다 — 장차 갈릴 수 있기 때문이다.

---
rule_id: reference.regulated_areas
unit: list
description: |
  조정대상지역(주택법 §63의2) 지정 현황 스냅샷. 블록 하나가 한 시점의 전체 목록이다.

  국토부 공고는 통상 '추가 지정분'만 열거하므로, 여기 담긴 전체 목록은 공고들을
  누적해 우리가 구성한 것이다. 개별 지역의 지정일은 regions[].since에 남겼다.

  ⚠️ 2025-10-16 이전 기간은 이력을 수집하지 않았다. 취득 시점 판정("취득 당시
  조정대상지역이었나")이 필요한데 그 시점이 2025-10-16보다 앞이면 엔진은
  판정하지 않고 사용자 확인을 요구한다. 없는 이력을 지어내는 것보다 낫다.
