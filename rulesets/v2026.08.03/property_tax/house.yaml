rule_id: property_tax.house.taxbase_cap_rate
unit: rate
description: |
  주택 과세표준상한율(지방세법 §110③).

  ★ 2023년 개편으로 주택 재산세의 세부담상한(§122)은 폐지되고 과세표준상한제로
    바뀌었다. §122 단서가 "다만, 주택의 경우에는 적용하지 아니한다"라고 명시한다.
    시중 계산기와 해설이 아직도 105/110/130% 세부담상한을 말하는 것은 폐지된 제도다.

  과세표준상한액 = 직전연도 과세표준 상당액 + (당해 시가표준액 과세표준 × 상한율)
  상한율은 0~5% 범위에서 대통령령으로 정한다.
blocks:
  - id: cap-rate-5pct
    tracks: [current, reform]
    effective_from: 2024-01-01
    basis: {law: 지방세법 시행령, article: "109-2", clause: "2", mst: "287223"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=287223&JO=010902", fetched_at: 2026-08-04}
    certainty: enacted
    value: "0.05"
    note: |
      ⚠️ 2026-08-04 감사에서 정정: certainty가 decree_pending이었는데, 시행령에
         **확정값이 이미 있다.** 지방세법 시행령 §109의2②:
           "법 제110조제3항의 계산식에서 '대통령령으로 정하는 비율'이란 100분의 5를 말한다"
         법률(§110③)이 위임한 값을 시행령이 이미 정했으므로 enacted다.

      확정된 값을 미확정으로 표시하면, 과표상한이 실제로 걸린 재산세 결과에
      근거 없는 '시행령 미정' 배지가 뜬다. 확실성 3축이 이 서비스의 핵심 주장인데
      반대 방향의 오류도 신뢰를 똑같이 깎는다.

