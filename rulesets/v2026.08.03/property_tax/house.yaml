rule_id: property_tax.house.urban_area_rate
unit: rate
description: |
  재산세 도시지역분(지방세법 §112①2). 과세표준 × 1.4/1000.
  조례로 2.3/1000까지 다르게 정할 수 있고(§112②), 도시지역 밖은 부과하지 않는다.
  시중 계산기는 이 두 가지를 묻지 않고 전국에 일률 부과한다.
blocks:
