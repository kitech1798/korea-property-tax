  1세대 1주택 세율 특례(지방세법 §111의2①).

  ★ 시가표준액 9억원 이하 주택에만 적용된다. 공시가격 9억 초과 1주택자는
    특례세율이 아니라 표준세율을 쓴다. 이 경계를 놓치면 고가 1주택의 세액이
    통째로 틀린다.
