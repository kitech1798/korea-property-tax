    effective_from: 2005-01-01
    basis: {law: 지방세법, article: "111", clause: "1", item: "3", mst: "282559"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=282559&JO=011100", fetched_at: 2026-08-04}
    certainty: enacted
    table:
      - {upto: 60000000, rate: "0.001"}
      - {upto: 150000000, rate: "0.0015", base_amount: 60000}
      - {upto: 300000000, rate: "0.0025", base_amount: 195000}
      - {upto: null, rate: "0.004", base_amount: 570000}

