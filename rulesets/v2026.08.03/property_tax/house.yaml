# 재산세 주택분 — 지방세법.
#
# 이번 2026.8.3 세제개편안에 재산세 개정 항목은 없다(지방세는 국세인 세제개편안
# 대상 11개 법률에 포함되지 않는다). 따라서 두 트랙 모두 현행법을 쓴다.
#
# 값은 전부 법제처 Open API로 받은 조문 원문에서 옮겼다.
# 원문 확인:  python tools/show_law.py 지방세법 111 110 111-2 112 122
#            python tools/show_law.py 지방세법_시행령 109
#
# ⚠ YAML 주의: 세법 문서의 연도 약칭('27, '28)을 따옴표 없이 쓰면 인용부호로
#   파싱된다. 문자열은 반드시 큰따옴표로 감싼다.

---
rule_id: property_tax.house.fair_market_ratio
unit: rate
description: |
  재산세 주택분 공정시장가액비율. 법률은 40~80% 범위만 정하고 실제 비율은 시행령이 정한다.

  ★ 43/44/45% 특례는 2026년도에 성립하는 납세의무에 한정된다(시행령 §109①2 단서).
    2027년 이후는 시행령이 다시 정하지 않는 한 60%로 돌아간다. 이 불확실성을
    숨기지 않고 decree_pending으로 표시한다.
blocks:
  - id: fmv-2026-one-house-under-3
    tracks: [current, reform]
    effective_from: 2026-01-01
    effective_to: 2026-12-31
    selector: {one_house_special: true, price_band: "~3억"}
    basis: {law: 지방세법 시행령, article: "109", clause: "1", item: "2", mst: "287223"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=287223&JO=010900", fetched_at: 2026-08-04}
    certainty: enacted
    value: "0.43"

  - id: fmv-2026-one-house-3-to-6
    tracks: [current, reform]
    effective_from: 2026-01-01
    effective_to: 2026-12-31
    selector: {one_house_special: true, price_band: "3~6억"}
    basis: {law: 지방세법 시행령, article: "109", clause: "1", item: "2", mst: "287223"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=287223&JO=010900", fetched_at: 2026-08-04}
    certainty: enacted
    value: "0.44"

  - id: fmv-2026-one-house-over-6
    tracks: [current, reform]
    effective_from: 2026-01-01
    effective_to: 2026-12-31
    selector: {one_house_special: true, price_band: "6억~"}
    basis: {law: 지방세법 시행령, article: "109", clause: "1", item: "2", mst: "287223"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=287223&JO=010900", fetched_at: 2026-08-04}
    certainty: enacted
    value: "0.45"
    note: "시행령 단서가 '시가표준액이 9억원을 초과하는 주택을 포함한다'고 명시하므로 고가 1주택도 45%다"

  - id: fmv-general
    tracks: [current, reform]
    effective_from: 2023-01-01
    selector: {one_house_special: false}
    basis: {law: 지방세법 시행령, article: "109", clause: "1", item: "2", mst: "287223"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=287223&JO=010900", fetched_at: 2026-08-04}
    certainty: enacted
    value: "0.60"

  - id: fmv-2027-onward-one-house-assumed
    tracks: [current, reform]
    effective_from: 2027-01-01
    selector: {one_house_special: true}
    basis: {law: 지방세법 시행령, article: "109", clause: "1", item: "2", mst: "287223"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=287223&JO=010900", fetched_at: 2026-08-04}
    certainty: decree_pending
    value: "0.45"
    note: |
      43~45% 특례는 조문상 2026년도 한정이다. 2027년 이후 비율은 매년 시행령으로 정해진다.
      정부 세제개편안 문답자료(p.44·p.46~47)의 2027~2028년 사례가 재산세를 2026년과
      동일하게 표시하므로, 특례 연장을 전제로 계산한 것으로 보고 45%를 기본값으로 둔다.
      확정이 아니므로 decree_pending — 화면에 "시행령 미정" 배지가 뜬다.

