rule_id: property_tax.house.burden_cap
unit: rate
description: |
  주택 재산세 세부담상한 — 폐지됨(지방세법 §122 단서).
  값이 아니라 '적용 안 함'을 명시적으로 데이터에 남긴다. 규칙이 없어서 안 쓴 것과
  법이 배제해서 안 쓴 것은 다르고, 후자는 감사 추적에 드러나야 한다.
blocks:
  - id: burden-cap-not-applicable
    tracks: [current, reform]
    effective_from: 2024-01-01
    basis: {law: 지방세법, article: "122", mst: "282559"}
    source: {kind: law_api, url: "https://www.law.go.kr/DRF/lawService.do?target=eflawjosub&MST=282559&JO=012200", fetched_at: 2026-08-04}
